<script type="text/babel">
    const { useState, useEffect, useMemo, useRef, createContext, useContext } = React;

    // ==========================================

    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyB7O1CAvbXloK379wXKwDY1SObgox7jf3U", authDomain: "liada-f7c95.firebaseapp.com",
        projectId: "liada-f7c95", storageBucket: "liada-f7c95.firebasestorage.app",
        messagingSenderId: "232514890985", appId: "1:232514890985:web:b6914e6b79682a90ca9478"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();
    db.enablePersistence().catch(err => console.warn("Offline DB Error:", err));

    const FirebaseService = {
        add: (collection, data) => db.collection(collection).add({ ...data, timestamp: firebase.firestore.FieldValue.serverTimestamp() }),
        update: (collection, id, data) => db.collection(collection).doc(id).update(data),
        delete: (collection, id) => db.collection(collection).doc(id).delete(),
        batchUpdate: (collection, updates) => {
            const batch = db.batch();
            updates.forEach(u => batch.update(db.collection(collection).doc(u.id), u.data));
            return batch.commit();
        },
        deleteSectorCascading: async (sectorId) => {
            const batch = db.batch();
            batch.delete(db.collection('sectoare').doc(sectorId));
            try {
                const magazineSnap = await db.collection('magazine').where('sectorId', '==', sectorId).get();
                const magIds = [];
                magazineSnap.forEach(doc => {
                    batch.delete(doc.ref);
                    magIds.push(doc.id);
                });
                if (magIds.length > 0) {
                    const productsSnap = await db.collection('produse_magazin').get();
                    const prodIds = [];
                    productsSnap.forEach(doc => {
                        const data = doc.data();
                        if (magIds.includes(data.magazinId)) {
                            batch.delete(doc.ref);
                            prodIds.push(doc.id);
                        }
                    });
                    if (prodIds.length > 0) {
                        const loturiSnap = await db.collection('loturi').get();
                        loturiSnap.forEach(doc => {
                            const data = doc.data();
                            if (prodIds.includes(data.produsId)) {
                                batch.delete(doc.ref);
                            }
                        });
                    }
                }
                await batch.commit();
            } catch (err) {
                console.error("Cascading deletion failed:", err);
                await db.collection('sectoare').doc(sectorId).delete();
            }
        },
        deleteStoreCascading: async (storeId) => {
            const batch = db.batch();
            batch.delete(db.collection('magazine').doc(storeId));
            try {
                const productsSnap = await db.collection('produse_magazin').where('magazinId', '==', storeId).get();
                const prodIds = [];
                productsSnap.forEach(doc => {
                    batch.delete(doc.ref);
                    prodIds.push(doc.id);
                });
                if (prodIds.length > 0) {
                    const loturiSnap = await db.collection('loturi').get();
                    loturiSnap.forEach(doc => {
                        const data = doc.data();
                        if (prodIds.includes(data.produsId)) {
                            batch.delete(doc.ref);
                        }
                    });
                }
                const pozeSnap = await db.collection('poze_magazine').where('magazinId', '==', storeId).get();
                pozeSnap.forEach(doc => {
                    batch.delete(doc.ref);
                });
                await batch.commit();
            } catch (err) {
                console.error("Store cascading deletion failed:", err);
                await db.collection('magazine').doc(storeId).delete();
            }
        },
        deleteProductCascading: async (productId) => {
            try {
                const prodRef = db.collection('produse_magazin').doc(productId);
                const prodDoc = await prodRef.get();
                const batch = db.batch();

                if (prodDoc.exists) {
                    const prodData = prodDoc.data() || {};
                    const imgDocId = `${prodData.categorie || ''}___${prodData.nume || ''}`.trim();
                    if (imgDocId !== '___') {
                        batch.delete(db.collection('imagini_produse').doc(imgDocId));
                    }
                }

                const loturiSnap = await db.collection('loturi').where('produsId', '==', productId).get();
                loturiSnap.forEach(doc => {
                    batch.delete(doc.ref);
                });

                batch.delete(prodRef);
                await batch.commit();
            } catch (err) {
                console.error("Product cascading deletion failed:", err);
                try {
                    const prodSnap = await db.collection('produse_magazin').doc(productId).get();
                    if (prodSnap.exists) {
                        const prodData = prodSnap.data() || {};
                        const imgDocId = `${prodData.categorie || ''}___${prodData.nume || ''}`.trim();
                        if (imgDocId !== '___') {
                            await db.collection('imagini_produse').doc(imgDocId).delete();
                        }
                    }
                } catch(e){}
                try { await db.collection('loturi').where('produsId', '==', productId).get().then(s => {
                    const b = db.batch();
                    s.forEach(doc => b.delete(doc.ref));
                    return b.commit();
                }); } catch(e){}
                try { await db.collection('produse_magazin').doc(productId).delete(); } catch(e){}
            }
        }
    };

    // ==========================================
    // 3. CONSTANTE (CONFIG & MAGIC STRINGS)
    // ==========================================
    const PAGES = { MAIN: 'main', SETTINGS: 'settings', SECTOR: 'sector', STORE: 'store', PRODUCT: 'product' };

    };

    const PREFERRED_CAT_ORDER = [

    const CONFIG = {
        COLORS: { LIADA_HEADER: '#ff3b30', SETTINGS_HEADER: '#333333', DEFAULT_SECTOR: '#007aff', DEFAULT_STORE: '#4CAF50' },
        DEFAULT_CATALOG: {
            "Maioneză - pachete": { termen: 180, unit: "zile", produse: ["🟢 De Casă 185g", "🟡 Provensal 185g", "🟢 De Casă 370g", "🟡 Provensal 370g", "🟢 De Casă 600g", "🟡 Provensal 600g", "🔴 De Elită 450g", "🔴 De Elită 650g", "🟤 Profi 370g"] },
            "Maioneze - căldări": { termen: 120, unit: "zile", produse: ["🔵 Delicios 850ml", "🟢 De Casă 850ml", "🟡 Provensal 850ml", "🟢 De Casă 1.4l", "🟡 Provensal 1.4l", "🟡 Provensal 630g"] },
            "Ketchup": { termen: 180, unit: "zile", produse: ["⚫ Chili 275g", "🟢 Frigărui 275g"] },
            "Paste de tomat": { termen: 180, unit: "zile", produse: ["🔵 Tomate 70g", "🔵 Tomate 275g"] },
            "Muștar": { termen: 120, unit: "zile", produse: ["🟡 Rusesc 200g"] },
            "Oțet": { termen: 12, unit: "luni", produse: ["🟤 Acid Acetic de Mere 5%", "🟢 Acid Acetic 6%", "🟡 Acid Acetic 9%"] },
            "Drojdii": { termen: 0, unit: "zile", produse: ["🟡 Secretul Bunicii 50g"] }
        },
        DEFAULT_RETELE: [{ nume: 'Local', culoare: '#4CAF50' }, { nume: 'Linella', culoare: '#E53935' }],
        DEFAULT_PROPS: ['Manager']
    };

    // ==========================================
    // 4. HELPER FUNCTIONS
    // ==========================================
    const Helpers = {
        convertDataToTime: (dateStr) => {
            if(!dateStr || dateStr === "Dată invalidă" || dateStr === "Calculată" || dateStr === "N/A" || typeof dateStr !== "string") return new Date(8640000000000000).getTime();
            let parts = dateStr.trim().split('.'); if(parts.length !== 3) return new Date(8640000000000000).getTime();
            return new Date(parts[2], parts[1] - 1, parts[0]).getTime();
        },
        calculeazaExpirare: (dataProdStr, categorieObj) => {
            if(!/^\d{2}\.\d{2}\.\d{4}$/.test(dataProdStr)) return "Dată invalidă";
            let parts = dataProdStr.split('.');
            let d = parseInt(parts[0], 10), m = parseInt(parts[1], 10), y = parseInt(parts[2], 10);
            if(isNaN(d) || isNaN(m) || isNaN(y)) return "Dată invalidă";
            
            let prodDate = new Date(y, m - 1, d);
            if(!categorieObj) return "Calculată";
            
            let termVal = parseInt(categorieObj.termen) || 0;
            if (categorieObj.unit === 'zile') prodDate.setDate(prodDate.getDate() + termVal);
            else if (categorieObj.unit === 'luni') prodDate.setMonth(prodDate.getMonth() + termVal);
            
            return `${String(prodDate.getDate()).padStart(2, '0')}.${String(prodDate.getMonth() + 1).padStart(2, '0')}.${prodDate.getFullYear()}`;
        },
        sortByOrder: (arr) => {
            return [...arr].sort((a, b) => {
                const orderA = a.order !== undefined ? a.order : (a.timestamp?.toMillis ? a.timestamp.toMillis() : 0);
                const orderB = b.order !== undefined ? b.order : (b.timestamp?.toMillis ? b.timestamp.toMillis() : 0);
                return orderA - orderB;
            });
        },
        initSortable: (container, dataRef, collectionName) => {
            let originalNextSibling = null;
            return new Sortable(container, {
                animation: 150, delay: 200, delayOnTouchOnly: true, touchStartThreshold: 5, ghostClass: 'sortable-ghost',
                onStart: (evt) => {
                    originalNextSibling = evt.item.nextSibling;
                },
                onEnd: (evt) => {
                    if (evt.oldIndex !== undefined && evt.newIndex !== undefined && evt.oldIndex !== evt.newIndex) {
                        // Revert standard DOM change so React can handle the rendering correctly
                        if (originalNextSibling) {
                            evt.from.insertBefore(evt.item, originalNextSibling);
                        } else {
                            evt.from.appendChild(evt.item);
                        }

                        const newOrder = [...dataRef.current];
                        const moved = newOrder.splice(evt.oldIndex, 1)[0];
                        newOrder.splice(evt.newIndex, 0, moved);
                        const updates = newOrder.map((item, idx) => ({ id: item.id, data: { order: idx } }));
                        FirebaseService.batchUpdate(collectionName, updates);
                    }
                }
            });
        }
    };

    // ==========================================
    // 5. REUSABLE COMPONENTS
    // ==========================================
    const PrimaryButton = ({ children, onClick, className="" }) => <button onClick={onClick} className={`flex-[2] p-4 font-[900] text-white uppercase text-[0.8rem] bg-accent rounded-xl shadow-lg hover:bg-blue-700 transition-colors ${className}`}>{children}</button>;

    const ButtonIcon = ({ icon, onClick, className = "", style }) => <button onClick={onClick} className={`bg-transparent border-none text-xl p-2 cursor-pointer flex justify-center items-center ${className}`} style={style}><i className={icon}></i></button>;

    const Card = ({ children, className = "", onClick, style, id }) => <div id={id} onClick={onClick} style={style} className={`bg-surface-color dark:bg-dark-surface mx-4 my-2.5 p-4 rounded-[15px] shadow-sm relative transition-all ${onClick ? 'cursor-pointer active:scale-[0.98]' : ''} ${className}`}>{children}</div>;
    const CardRow = ({ children, className = "", onClick }) => <div onClick={onClick} className={`flex justify-between items-center py-2.5 border-b border-border-color dark:border-dark-border last:border-b-0 ${onClick ? 'cursor-pointer' : ''} ${className}`}>{children}</div>;

    const FAB = ({ onClick }) => <button onClick={onClick} className="fixed bottom-[30px] right-[30px] w-[64px] h-[64px] rounded-full bg-surface-color/90 dark:bg-dark-surface/90 backdrop-blur-md text-accent border border-border-color dark:border-dark-border text-[1.8rem] shadow-lg cursor-pointer z-[99] flex justify-center items-center hover:scale-105 transition-transform"><i className="fas fa-plus"></i></button>;
    const FABSearch = ({ onClick }) => <button onClick={onClick} className="fixed bottom-[30px] left-[30px] w-[64px] h-[64px] rounded-full bg-surface-color/90 dark:bg-dark-surface/90 backdrop-blur-md text-accent border border-border-color dark:border-dark-border text-[1.8rem] shadow-lg cursor-pointer z-[99] flex justify-center items-center hover:scale-105 transition-transform"><i className="fas fa-search"></i></button>;

    const FrozenHeader = ({ title, subtitle, bgColor, actions, nav }) => (
        <div className="sticky top-2.5 mx-4 my-2.5 p-[15px_20px] rounded-[25px] flex flex-col gap-2 z-[100] shadow-lg text-white backdrop-blur-md" style={{ backgroundColor: bgColor }}>
            <div className="flex justify-between items-center border-b border-white/30 pb-1.5">
                <div>
                    <h2 className="m-0 text-[1.6rem] font-[900] leading-tight text-white">{title}</h2>
                    {subtitle && <p className="m-0 text-[0.9rem] opacity-90 font-medium text-white">{subtitle}</p>}

    const BaseModal = ({ isOpen, title, children }) => {
        if (!isOpen) return null;
        return (
            <div className="fixed inset-0 bg-black/60 z-[1000] flex justify-center items-center backdrop-blur-sm">
                <div className="bg-surface-color dark:bg-dark-surface p-6 rounded-[24px] w-[90%] max-w-[420px] shadow-2xl animate-scale-in">
                    <h3 className="mt-0 mb-4 text-xl font-black">{title}</h3>
                    {children}
                </div>

    };

    // ==========================================
    // 6. CONTEXT & STATE MANAGEMENT
    // ==========================================
    const AppContext = createContext();
    const useApp = () => useContext(AppContext);

    const AppProvider = ({ children }) => {
        const [isReady, setIsReady] = useState(false);
        const [view, setView] = useState({ page: PAGES.MAIN, data: null });
        const [theme, setTheme] = useState(localStorage.getItem('theme') || 'system');
        const [modal, setModal] = useState({ type: null, data: null }); 

        const [dbSectoare, setDbSectoare] = useState({});
        const [dbMagazine, setDbMagazine] = useState({});
        const [dbProduse, setDbProduse] = useState({});
        const [dbLoturi, setDbLoturi] = useState({});

        // Funcție utilitară pentru a citi din localStorage în siguranță de la început
        const getLocalStorageItem = (key, defaultValue) => {
            try {
                const item = localStorage.getItem(key);
                return item ? JSON.parse(item) : defaultValue;
            } catch (e) {
                return defaultValue;
            }
        };

        const CATEGORY_TOMBSTONES_KEY = 'catalogDeletedCategories';
        const getDeletedCategories = () => {
            try {
                const item = localStorage.getItem(CATEGORY_TOMBSTONES_KEY);
                const arr = item ? JSON.parse(item) : [];
                return Array.isArray(arr) ? arr.map(v => String(v).trim()).filter(Boolean) : [];
            } catch (e) {
                return [];
            }
        };
        const saveDeletedCategories = (list) => {
            const normalized = Array.from(new Set((list || []).map(v => String(v).trim()).filter(Boolean)));
            try { localStorage.setItem(CATEGORY_TOMBSTONES_KEY, JSON.stringify(normalized)); } catch (e) {}
            return normalized;
        };
        const filterDeletedCategories = (catalog, deletedList = getDeletedCategories()) => {
            const deletedSet = new Set((deletedList || []).map(v => String(v).trim().toLowerCase()).filter(Boolean));
            const filtered = {};
            Object.entries(catalog || {}).forEach(([name, data]) => {
                if (!deletedSet.has(String(name).trim().toLowerCase())) filtered[name] = data;
            });
            return filtered;
        };

        // Setări Globale cu stocare hibridă (Firestore + LocalStorage) pentru robustețe maximă la recompilare
        const [catalogCategorii, setCatalogCategorii] = useState(() => filterDeletedCategories(getLocalStorageItem('catalogCategorii', CONFIG.DEFAULT_CATALOG)));
        const [deletedCategories, setDeletedCategories] = useState(() => getDeletedCategories());
        const [reteleMagazine, setReteleMagazine] = useState(() => getLocalStorageItem('reteleMagazine', CONFIG.DEFAULT_RETELE));
        const [proprietatiMagazine, setProprietatiMagazine] = useState(() => getLocalStorageItem('proprietatiMagazine', CONFIG.DEFAULT_PROPS));
        const [googleSpreadsheetId, setGoogleSpreadsheetId] = useState(() => localStorage.getItem('googleSpreadsheetId') || '');
        const [googleSheetName, setGoogleSheetName] = useState(() => localStorage.getItem('googleSheetName') || 'Sheet1');
        const [googleAppsScriptUrl, setGoogleAppsScriptUrl] = useState(() => localStorage.getItem('googleAppsScriptUrl') || '');

        const getExpConf = (lvl, defVal, defUnit) => ({ val: Math.max(0, parseInt(localStorage.getItem(`expTimeVal_${lvl}`)) || defVal), unit: localStorage.getItem(`expTimeUnit_${lvl}`) || defUnit });
        const [expConfigs, setExpConfigs] = useState({ global: getExpConf('global', 2, 'luni'), sector: getExpConf('sector', 1, 'luni'), store: getExpConf('store', 2, 'saptamani') });
        const deletedCategoriesRef = useRef(deletedCategories);
        deletedCategoriesRef.current = deletedCategories;
        const buildBackupPayload = (scope) => {
            const base = {
                backupType: scope,
                version: 2,
                createdAt: new Date().toISOString()
            };

            if (scope === 'settings') {
                return {
                    ...base,
                    catalogCategorii,
                    deletedCategories,
                    reteleMagazine,
                    proprietatiMagazine,
                    expConfigs,
                    googleSpreadsheetId,
                    googleSheetName,
                    googleAppsScriptUrl
                };
            }

            if (scope === 'products_lots') {
                const produse = Object.values(dbProduse).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
                const loturi = Object.values(dbLoturi).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
                return {
                    ...base,
                    produse,
                    loturi
                };
            }

            const sectoare = Object.values(dbSectoare).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
            const magazine = Object.values(dbMagazine).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
            return {
                ...base,
                sectoare,
                magazine
            };
        };

        const downloadJson = (payload, fileName) => {
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        };

        const handleExportBackup = (scope = 'settings') => {
            const normalizedScope = ['sectors_stores', 'products_lots'].includes(scope) ? scope : 'settings';
            const payload = buildBackupPayload(normalizedScope);
            const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
            const fileName = normalizedScope === 'settings'
                ? `liada-backup-setari-${stamp}.json`
                : normalizedScope === 'products_lots'
                    ? `liada-backup-produse-loturi-${stamp}.json`
                    : `liada-backup-sectoare-magazine-${stamp}.json`;
            downloadJson(payload, fileName);
        };

        // Storage Updates - salvează în paralel în Firestore și în LocalStorage pentru a reduce riscul de pierdere a setărilor
        const updateCatalog = async (newCat, deletedList = deletedCategoriesRef.current) => { 
            const normalizedDeleted = saveDeletedCategories(deletedList);
            const normalized = filterDeletedCategories(newCat, normalizedDeleted);
            setDeletedCategories(normalizedDeleted);
            setCatalogCategorii(normalized);
            try { localStorage.setItem('catalogCategorii', JSON.stringify(normalized)); } catch(e){}
            try { localStorage.setItem(CATEGORY_TOMBSTONES_KEY, JSON.stringify(normalizedDeleted)); } catch(e){}
            try {
                await db.collection('setari').doc('config_global').update({ 
                    catalogCategorii: normalized, 
                    deletedCategories: normalizedDeleted 
                });
            } catch (err) {
                console.error("Error writing catalog:", err);
                // Dacă documentul nu există încă, îl creăm explicit cu valorile curente.
                try {
                    await db.collection('setari').doc('config_global').set({ 
                        catalogCategorii: normalized, 
                        deletedCategories: normalizedDeleted 
                    }, { merge: true });
                } catch (e) {
                    console.error("Fallback write failed:", e);
                }
            }
        };
        const updateRetele = (newRet) => { 
            setReteleMagazine(newRet);
            try { localStorage.setItem('reteleMagazine', JSON.stringify(newRet)); } catch(e){}
            db.collection('setari').doc('config_global').set({ reteleMagazine: newRet }, { merge: true })
              .catch(err => console.error("Error writing retele:", err));
        };
        const updateProp = (newProp) => { 
            setProprietatiMagazine(newProp);
            try { localStorage.setItem('proprietatiMagazine', JSON.stringify(newProp)); } catch(e){}
            db.collection('setari').doc('config_global').set({ proprietatiMagazine: newProp }, { merge: true })
              .catch(err => console.error("Error writing properties:", err));
        };
        const updateGoogleSpreadsheetId = (id) => {
            setGoogleSpreadsheetId(id);
            try { localStorage.setItem('googleSpreadsheetId', id); } catch(e){}
            db.collection('setari').doc('config_global').set({ googleSpreadsheetId: id }, { merge: true })
              .catch(err => console.error("Error writing spreadsheet ID:", err));
        };
        const updateGoogleSheetName = (name) => {
            setGoogleSheetName(name);
            try { localStorage.setItem('googleSheetName', name); } catch(e){}
            db.collection('setari').doc('config_global').set({ googleSheetName: name }, { merge: true })
              .catch(err => console.error("Error writing sheet name:", err));
        };
        const updateGoogleAppsScriptUrl = (url) => {
            setGoogleAppsScriptUrl(url);
            try { localStorage.setItem('googleAppsScriptUrl', url); } catch(e){}
            db.collection('setari').doc('config_global').set({ googleAppsScriptUrl: url }, { merge: true })
              .catch(err => console.error("Error writing Google Apps Script URL:", err));
        };
        const updateExpConfig = (type, val, unit) => { 
            localStorage.setItem(`expTimeVal_${type}`, val); 
            localStorage.setItem(`expTimeUnit_${type}`, unit); 
            setExpConfigs(prev => ({ ...prev, [type]: { val, unit } })); 
        };

        // Modal Helpers
        const openModal = (type, data = null) => setModal({ type, data });
        const closeModal = () => setModal({ type: null, data: null });
        const confirmAction = (title, msg, onConfirm) => openModal(MODAL_TYPES.CONFIRM, { title, msg, onConfirm });
        const promptAction = (title, val, placeholder, onSave) => openModal(MODAL_TYPES.PROMPT, { title, val, placeholder, onSave });

        // Theme sync
        useEffect(() => {
            if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark'); document.body.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark'); document.body.setAttribute('data-theme', 'light');
            }
            localStorage.setItem('theme', theme);
        }, [theme]);

        // Firebase Realtime Sync pentru Date Aplicație & Setări Globale
        useEffect(() => {
            let loads = 0; 
            const checkReady = () => { loads++; if(loads === 5) setTimeout(() => setIsReady(true), 300); };
            
            const u1 = db.collection('sectoare').onSnapshot(s => { let obj={}; s.forEach(d => obj[d.id] = {id: d.id, ...d.data()}); setDbSectoare(obj); checkReady(); }, err => console.error(err));
            const u2 = db.collection('magazine').onSnapshot(s => { let obj={}; s.forEach(d => obj[d.id] = {id: d.id, ...d.data()}); setDbMagazine(obj); checkReady(); }, err => console.error(err));
            const u3 = db.collection('produse_magazin').onSnapshot(s => { let obj={}; s.forEach(d => obj[d.id] = {id: d.id, ...d.data()}); setDbProduse(obj); checkReady(); }, err => console.error(err));
            const u4 = db.collection('loturi').onSnapshot(s => { let obj={}; s.forEach(d => obj[d.id] = {id: d.id, ...d.data()}); setDbLoturi(obj); checkReady(); }, err => console.error(err));
            
            // Ascultăm în timp real documentul global de setări din Firestore pentru sincronizare universală (mobil <-> desktop)
            const u5 = db.collection('setari').doc('config_global').onSnapshot(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    const remoteDeleted = Array.isArray(data.deletedCategories) ? data.deletedCategories : [];
                    const mergedDeleted = saveDeletedCategories([...getDeletedCategories(), ...remoteDeleted]);
                    if (mergedDeleted.length) {
                        setDeletedCategories(prev => JSON.stringify(prev) === JSON.stringify(mergedDeleted) ? prev : mergedDeleted);
                        try { localStorage.setItem(CATEGORY_TOMBSTONES_KEY, JSON.stringify(mergedDeleted)); } catch(e){}
                    }
                    if (data.catalogCategorii) {
                        const cleanedCatalog = filterDeletedCategories(data.catalogCategorii, mergedDeleted);
                        try { localStorage.setItem('catalogCategorii', JSON.stringify(cleanedCatalog)); } catch(e){}
                        setCatalogCategorii(prev => JSON.stringify(prev) === JSON.stringify(cleanedCatalog) ? prev : cleanedCatalog);
                    }
                    if (data.reteleMagazine) {
                        try { localStorage.setItem('reteleMagazine', JSON.stringify(data.reteleMagazine)); } catch(e){}
                        setReteleMagazine(prev => JSON.stringify(prev) === JSON.stringify(data.reteleMagazine) ? prev : data.reteleMagazine);
                    }
                    if (data.proprietatiMagazine) {
                        try { localStorage.setItem('proprietatiMagazine', JSON.stringify(data.proprietatiMagazine)); } catch(e){}
                        setProprietatiMagazine(prev => JSON.stringify(prev) === JSON.stringify(data.proprietatiMagazine) ? prev : data.proprietatiMagazine);
                    }
                    if (data.googleSpreadsheetId !== undefined) {
                        setGoogleSpreadsheetId(data.googleSpreadsheetId);
                        try { localStorage.setItem('googleSpreadsheetId', data.googleSpreadsheetId); } catch(e){}
                    }
                    if (data.googleSheetName !== undefined) {
                        setGoogleSheetName(data.googleSheetName);
                        try { localStorage.setItem('googleSheetName', data.googleSheetName); } catch(e){}
                    }

                    if (data.googleAppsScriptUrl !== undefined) {
                        setGoogleAppsScriptUrl(data.googleAppsScriptUrl);
                        try { localStorage.setItem('googleAppsScriptUrl', data.googleAppsScriptUrl); } catch(e){}
                    }
                } else {
                    // Dacă documentul global lipsește, nu îl recreăm automat cu valori standard.
                    // Păstrăm stările locale și evităm orice suprascriere automată a setărilor existente.
                    console.warn("config_global lipsește din Firestore; aplicația folosește valorile locale fără a rescrie datele standard.");
                }
                checkReady();
            }, err => {
                console.warn("Settings listener error, fallback automatic la localStorage:", err);
                checkReady();
            });

            return () => { u1(); u2(); u3(); u4(); u5(); };
        }, []);

        // History API (Swipe Back logic)
        const uiDepthRef = useRef(0);
        const popLockRef = useRef(false);

        const closeTopLayer = () => {
            if (modal.type) { closeModal(); return true; }
            if (view.page === PAGES.PRODUCT) { setView({page: PAGES.STORE, data: view.data.backData}); return true; }
            if (view.page === PAGES.STORE) { setView({page: PAGES.SECTOR, data: view.data.sector}); return true; }
            if (view.page === PAGES.SECTOR || view.page === PAGES.SETTINGS) { setView({page: PAGES.MAIN, data: null}); return true; }
            return false;
        };

        const getUiDepth = () => {
            let d = 0;
            if (view.page === PAGES.SECTOR || view.page === PAGES.SETTINGS) d = 1;
            if (view.page === PAGES.STORE) d = 2;
            if (view.page === PAGES.PRODUCT) d = 3;
            if (modal.type) d++;
            return d;
        };

        useEffect(() => { history.replaceState({ appDepth: 0 }, document.title); }, []);

        useEffect(() => {
            const depth = getUiDepth();
            if (popLockRef.current) { uiDepthRef.current = depth; popLockRef.current = false; return; }
            if (depth > uiDepthRef.current) { history.pushState({ appDepth: depth }, document.title); }
            uiDepthRef.current = depth;
        }, [view, modal]);

        useEffect(() => {
            const onPopState = () => { popLockRef.current = true; closeTopLayer(); };
            window.addEventListener('popstate', onPopState);
            return () => window.removeEventListener('popstate', onPopState);
        }, [view, modal]);

        const contextValue = {
            isReady, view, setView, theme, setTheme, modal, openModal, closeModal, confirmAction, promptAction,
            dbSectoare, dbMagazine, dbProduse, dbLoturi,
            catalogCategorii, updateCatalog, deletedCategories, reteleMagazine, updateRetele, proprietatiMagazine, updateProp, expConfigs, updateExpConfig,
            googleSpreadsheetId, updateGoogleSpreadsheetId, googleSheetName, updateGoogleSheetName,
            googleAppsScriptUrl, updateGoogleAppsScriptUrl,
            handleExportBackup
        };

        return <AppContext.Provider value={contextValue}>{children}</AppContext.Provider>;
    };

    // --- Componentă Expirări Reutilizabilă ---
    const ExpirariBox = ({ type, data }) => {
        const { dbSectoare, dbMagazine, dbProduse, dbLoturi, expConfigs, updateExpConfig, setView, catalogCategorii } = useApp();
        const config = expConfigs[type];
        const [val, setVal] = useState(config.val === 0 ? '' : config.val);
        const [unit, setUnit] = useState(config.unit);

        const handleConfigChange = (newValStr, newUnit) => { 
            setVal(newValStr); setUnit(newUnit); 
            let parsedVal = Math.max(0, parseInt(newValStr) || 0);
            updateExpConfig(type, parsedVal, newUnit); 
        };

        const zileMaxime = useMemo(() => {
            let v = parseInt(val) || 0;
            if(unit === 'saptamani') return v * 7; if(unit === 'luni') return v * 30; return v;
        }, [val, unit]);

        const items = useMemo(() => {
            let arr = []; let msAzi = new Date().setHours(0,0,0,0);
            for(let lotId in dbLoturi) {
                let lot = dbLoturi[lotId]; 
                let prod = dbProduse[lot.produsId]; if(!prod) continue;
                let mag = dbMagazine[prod.magazinId]; if(!mag) continue;
                let sec = dbSectoare[mag.sectorId]; if(!sec) continue;

                let isDrojdii = prod.categorie === 'Drojdii';
                let lotDataExp = lot.dataExp;
                if (!isDrojdii && lot.dataProd && lot.dataProd !== "N/A") {
                    let catObj = catalogCategorii[prod.categorie];
                    let expCalc = Helpers.calculeazaExpirare(lot.dataProd, catObj);
                    if (expCalc !== "Dată invalidă") {
                        lotDataExp = expCalc;
                    }
                }

                let expTime = Helpers.convertDataToTime(lotDataExp);
                if(expTime > 8000000000000000) continue; 
                let zileRamase = Math.round((expTime - msAzi) / (1000 * 3600 * 24));

                if (zileRamase <= zileMaxime) {
                    if (type === 'global' || (type === 'sector' && data?.currentSectorId === sec.id) || (type === 'store' && data?.currentStoreId === mag.id)) {
                        arr.push({ lot: { ...lot, dataExp: lotDataExp }, prod, mag, sec, zile: zileRamase });
                    }
                }
            }
            return arr.sort((a, b) => a.zile - b.zile);
        }, [dbSectoare, dbMagazine, dbProduse, dbLoturi, zileMaxime, type, data, catalogCategorii]);

        return (
            <Card className="!border-[1.5px] !border-danger !shadow-lg">
                <div className="flex justify-between items-center font-bold text-[1.1rem] text-danger flex-wrap gap-2 border-b border-danger/20 pb-3">
                    <span className="flex items-center gap-2"><i className="fas fa-exclamation-circle text-xl"></i> Expiră în curând</span>
                    <div className="flex gap-2 items-center bg-transparent border border-border-color dark:border-dark-border p-1.5 rounded-xl">
                        <input type="number" min="0" placeholder="0" value={val} onChange={e => setVal(e.target.value)} onBlur={() => handleConfigChange(val, unit)} className="w-[45px] bg-transparent text-center font-bold outline-none text-text-main dark:text-dark-text-main" />
                        <select value={unit} onChange={e => handleConfigChange(val, e.target.value)} className="bg-transparent dark:bg-dark-surface font-bold outline-none cursor-pointer text-text-main dark:text-white">
                            <option value="zile" className="dark:bg-dark-surface dark:text-white">Zile</option>
                            <option value="saptamani" className="dark:bg-dark-surface dark:text-white">Săpt.</option>
                            <option value="luni" className="dark:bg-dark-surface dark:text-white">Luni</option>
                        </select>
                    </div>
                </div>
                <div className="pt-2">
                    {items.length === 0 ? (
                        <div className="p-4 text-center text-text-sec font-medium">Toate produsele sunt în termen.</div>
                    ) : items.map((item, idx) => (
                        <div key={idx} className="border-b border-border-color dark:border-dark-border py-4 flex justify-between items-start last:border-0">
                            <div className="flex-1 pr-2">
                                <div className="mb-2 cursor-pointer font-black text-[1.05rem]" onClick={() => setView({page: PAGES.PRODUCT, data: { id: item.prod.id, nume: item.prod.nume, categorie: item.prod.categorie, magazinCuloare: item.mag.culoare, magazinNume: item.mag.nume, magazinAdresa: item.mag.adresa, backData: {magazin: item.mag, sector: item.sec} }})}>
                                    {item.prod.nume} <span className="text-text-sec font-medium text-[0.9rem]">({item.lot.cantitate} buc)</span>
                                </div>
                                <div className="text-[0.9rem] mb-3 font-medium">
                                    {item.zile < 0 ? (
                                        <span className="text-text-main dark:text-white">
                                            A expirat de <span className="text-danger font-black">{Math.abs(item.zile)} zile</span>
                                        </span>
                                    ) : item.zile === 0 ? (
                                        <span className="text-danger font-black animate-pulse">Expiră ASTĂZI</span>
                                    ) : (
                                        <span className="text-text-main dark:text-white">
                                            Va expira în <span className="text-danger font-black">{item.zile} zile</span>
                                        </span>
                                    )}
                                </div>
                                {(type === 'global' || type === 'sector') && (
                                    <div className="flex flex-wrap gap-2 mt-2">
                                        {type === 'global' && (
                                            <span onClick={() => setView({page: PAGES.SECTOR, data: item.sec})} className="inline-flex items-center gap-1.5 px-3 py-1 bg-surface-color dark:bg-dark-surface text-text-main dark:text-dark-text-main rounded-xl text-[0.75rem] font-bold cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-800 shadow-sm border border-border-color/50 dark:border-dark-border/50">
                                                <i className="fas fa-map" style={{color: item.sec.culoare}}></i> {item.sec.nume}
                                            </span>
                                        )}
                                        <span onClick={() => setView({page: PAGES.STORE, data: {magazin: item.mag, sector: item.sec}})} className="inline-flex items-center gap-1.5 px-3 py-1 bg-surface-color dark:bg-dark-surface text-text-main dark:text-dark-text-main rounded-xl text-[0.75rem] font-bold cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-800 shadow-sm border border-border-color/50 dark:border-dark-border/50">
                                            <i className="fas fa-store" style={{color: item.mag.culoare}}></i> {item.mag.nume}
                                        </span>
                                    </div>
                                )}
                            </div>
                            <div className="text-danger text-[1.1rem] font-black self-center">
                                {item.lot.dataExp}
                            </div>
                        </div>
                    ))}
                </div>
            </Card>
        );
    };

    // ==========================================
    // 7. PAGE COMPONENTS
    // ==========================================
    const MainPage = () => {
        const { 
            setView, dbSectoare, dbMagazine, catalogCategorii, reteleMagazine, proprietatiMagazine, expConfigs,
            googleSpreadsheetId, googleSheetName, googleAppsScriptUrl,
            updateCatalog, updateRetele, updateProp, updateExpConfig, updateGoogleSpreadsheetId, updateGoogleSheetName, updateGoogleAppsScriptUrl,
            confirmAction, openModal, modal, closeModal 
        } = useApp();
        const arrSectoare = Helpers.sortByOrder(Object.values(dbSectoare));
        
        const containerRef = useRef(null);
        const dataRef = useRef(arrSectoare);
        const fileInputRef = useRef(null);
        dataRef.current = arrSectoare;
        const [newSect, setNewSect] = useState({ nume: '', culoare: CONFIG.COLORS.DEFAULT_SECTOR });

        const applySettingsBackup = async (data) => {
            const importedDeleted = Array.isArray(data.deletedCategories) ? data.deletedCategories : [];
            setDeletedCategories(importedDeleted);
            saveDeletedCategories(importedDeleted);
            if (data.catalogCategorii) updateCatalog(data.catalogCategorii, importedDeleted);
            if (data.reteleMagazine) updateRetele(data.reteleMagazine);
            if (data.proprietatiMagazine) updateProp(data.proprietatiMagazine);
            if (data.expConfigs) {
                for (const key of ['global', 'sector', 'store']) {
                    if (data.expConfigs[key]) {
                        const cfg = data.expConfigs[key];
                        updateExpConfig(key, Math.max(0, parseInt(cfg.val) || 0), cfg.unit || 'zile');
                    }
                }
            }
            if (data.googleSpreadsheetId !== undefined) updateGoogleSpreadsheetId(data.googleSpreadsheetId);
            if (data.googleSheetName !== undefined) updateGoogleSheetName(data.googleSheetName);
            if (data.googleAppsScriptUrl !== undefined) updateGoogleAppsScriptUrl(data.googleAppsScriptUrl);
        };

        const applyStructureBackup = async (data) => {
            const sectoare = Array.isArray(data.sectoare) ? data.sectoare : [];
            const magazine = Array.isArray(data.magazine) ? data.magazine : [];
            const batchSize = 450;

            const deleteAllDocs = async (collectionName) => {
                const snap = await db.collection(collectionName).get();
                const refs = [];
                snap.forEach(doc => refs.push(doc.ref));
                for (let i = 0; i < refs.length; i += batchSize) {
                    const batch = db.batch();
                    refs.slice(i, i + batchSize).forEach(ref => batch.delete(ref));
                    await batch.commit();
                }
            };

            await deleteAllDocs('sectoare');
            await deleteAllDocs('magazine');

            for (let i = 0; i < sectoare.length; i += batchSize) {
                const batch = db.batch();
                sectoare.slice(i, i + batchSize).forEach(item => {
                    if (item && item.id) batch.set(db.collection('sectoare').doc(item.id), item);
                });
                await batch.commit();
            }
            for (let i = 0; i < magazine.length; i += batchSize) {
                const batch = db.batch();
                magazine.slice(i, i + batchSize).forEach(item => {
                    if (item && item.id) batch.set(db.collection('magazine').doc(item.id), item);
                });
                await batch.commit();
            }
        };

        const handleImportFile = async (file) => {
            if (!file) return;
            try {
                const raw = await file.text();
                const data = JSON.parse(raw);
                const backupType = data.backupType || (data.catalogCategorii ? 'settings' : (data.sectoare && data.magazine ? 'sectors_stores' : null));
                if (!backupType) {
                    alert('Fișierul nu pare a fi o copie de rezervă validă.');
                    return;
                }
                if (backupType === 'settings') {
                    confirmAction(
                        'Import setări',
                        'Acest fișier va restabili rețelele, proprietățile, produsele și termenele de expirare din Setări. Continui?',
                        async () => { await applySettingsBackup(data); }
                    );
                } else if (backupType === 'sectors_stores') {
                    confirmAction(
                        'Import sectoare și magazine',
                        'Acest fișier va adăuga/înlocui sectoarele și magazinele din copie de rezervă. Continui?',
                        async () => { await applyStructureBackup(data); }
                    );
                } else {
                    alert('Tipul fișierului de backup nu este recunoscut.');
                }
            } catch (err) {
                console.error(err);
                alert('Nu am putut citi fișierul selectat.');
            } finally {
                if (fileInputRef.current) fileInputRef.current.value = '';
            }
        };

        useEffect(() => {
            if (containerRef.current) {
                const sortable = Helpers.initSortable(containerRef.current, dataRef, 'sectoare');
                return () => sortable.destroy();
            }
        }, [arrSectoare.length]);

        const handleSave = () => {
            if(newSect.nume) { FirebaseService.add('sectoare', { ...newSect, order: arrSectoare.length }); closeModal(); }
        };

        return (
            <div className="animate-fade-in pb-[100px]">
                <FrozenHeader title="LIADA" bgColor={CONFIG.COLORS.LIADA_HEADER} actions={<div className="flex items-center gap-1"><ButtonIcon icon="fas fa-file-import text-white" onClick={() => fileInputRef.current?.click()} /><ButtonIcon icon="fas fa-file-export text-white" onClick={() => openModal(MODAL_TYPES.EXPORT_BACKUP)} /><ButtonIcon icon="fas fa-cog text-white" onClick={() => setView({page: PAGES.SETTINGS})} /></div>} nav={<React.Fragment></React.Fragment>} />
                <input ref={fileInputRef} type="file" accept="application/json,.json" className="hidden" onChange={(e) => handleImportFile(e.target.files?.[0])} />
                
                {/* w-full face ca chenarele sectoarelor să aibă exact aceeași lățime/margini ca și headerul Freeze 'LIADA' */}
                <div className="w-full" ref={containerRef}>
                    {arrSectoare.length === 0 ? <div className="p-5 text-center text-text-sec font-medium">Nu există sectoare adăugate.</div> : null}
                    {arrSectoare.map(s => (
                        <Card key={s.id} onClick={() => setView({page: PAGES.SECTOR, data: s})} className="text-white !p-0 overflow-hidden !rounded-[25px] !shadow-md transition-transform" style={{backgroundColor: s.culoare || CONFIG.COLORS.DEFAULT_SECTOR}}>
                            <div className="flex justify-between items-center p-[20px] font-black text-[1.2rem]">
                                {s.nume}
                                <ButtonIcon icon="fas fa-trash text-white" onClick={(e) => { e.stopPropagation(); confirmAction("Ștergere", "Ștergi sectorul, inclusiv toate magazinele și produsele sale?", () => FirebaseService.deleteSectorCascading(s.id)); }} />
                            </div>
                        </Card>
                    ))}
                </div>

                <ExpirariBox type="global" />
                <FABSearch onClick={() => openModal(MODAL_TYPES.SEARCH)} />
                <FAB onClick={() => { setNewSect({ nume: '', culoare: CONFIG.COLORS.DEFAULT_SECTOR }); openModal(MODAL_TYPES.ADD_SECTOR); }} />

                <BaseModal isOpen={modal.type === MODAL_TYPES.ADD_SECTOR} title="Adaugă Sector">
                    <Input placeholder="Denumire Sector" value={newSect.nume} onChange={e => setNewSect({...newSect, nume: e.target.value})} />
                    <Input type="color" value={newSect.culoare} onChange={e => setNewSect({...newSect, culoare: e.target.value})} className="!h-[50px] !p-[3px] cursor-pointer" />
                    <div className="flex gap-3 pt-5 mt-2">
                        <SecondaryButton onClick={closeModal}>Anulează</SecondaryButton>
                        <PrimaryButton onClick={handleSave}>Salvează</PrimaryButton>
                    </div>
                </BaseModal>
            </div>
        );
    };

    // Componente auxiliare pentru gestionarea și afișarea imaginii produsului / codurilor de bare
    const ProductImageModalContent = ({ catName, prodName, closeModal }) => {
        const [imageUrl, setImageUrl] = useState('');
        const [loading, setLoading] = useState(true);
        const [saving, setSaving] = useState(false);
        const [dragActive, setDragActive] = useState(false);
        const docId = `${catName}___${prodName}`;

        useEffect(() => {
            const unsubscribe = db.collection('imagini_produse').doc(docId).onSnapshot(doc => {
                if (doc.exists) {
                    setImageUrl(doc.data().image || '');
                } else {
                    setImageUrl('');
                }
                setLoading(false);
            }, err => {
                console.error("Eroare la citirea imaginii produsului:", err);
                setLoading(false);
            });
            return () => unsubscribe();
        }, [docId]);

        const handleFileSelect = (file) => {
            if (!file) return;
            setSaving(true);
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const MAX_SIZE = 800; // Calitate excelentă a imaginii, dar redimensionată sub limita de 1MB a documentului Firestore
                    if (width > height) {
                        if (width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        }
                    } else {
                        if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);

                    db.collection('imagini_produse').doc(docId).set({
                        image: compressedDataUrl,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true })
                    .then(() => {
                        setSaving(false);
                    })
                    .catch(err => {
                        console.error("Eroare salvare image:", err);
                        setSaving(false);
                        alert("Eroare salvare: " + err.message);
                    });
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

            try {

                snap.forEach(doc => ids.push(doc.id));

                for (const id of ids) {
                    await FirebaseService.deleteProductCascading(id);

                const nextDeleted = [
                    ...deletedCategories.filter(c => String(c).trim().toLowerCase() !== catName.trim().toLowerCase()),
                    catName
                ];

                const nextCatalog = { ...catalogCategorii };
                delete nextCatalog[catName];

                const orderedKeys = Object.keys(nextCatalog);
                orderedKeys.forEach((k, idx) => {
                    if (nextCatalog[k] && nextCatalog[k].order === undefined) {
                        nextCatalog[k].order = idx;
                    }
                });

                // Actualizare imediată în UI / localStorage + scriere directă în Firestore

                                    <li>Din meniul de sus, selectează <strong>Extensii (Extensions) &gt; Apps Script</strong>.</li>
                                    <li>Șterge codul implicit de acolo și lipește următorul script de înregistrare:
                                        <pre className="p-2 border border-border-color bg-gray-50 dark:bg-gray-900 text-slate-800 dark:text-slate-200 rounded-lg font-mono text-[0.65rem] overflow-x-auto select-all max-h-32 mt-1 whitespace-pre unicode-bidi overflow-y-auto">
{`function doPost(e) {
  try {
    var data = JSON.parse(e.postData.contents);
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(data.sheetName || "Sheet1");
    if (!sheet) return ContentService.createTextOutput(JSON.stringify({error: "Fila " + (data.sheetName || "Sheet1") + " este inexistenta"})).setMimeType(ContentService.MimeType.JSON);
    var rows = sheet.getDataRange().getValues();
    if (rows.length === 0) return ContentService.createTextOutput(JSON.stringify({error: "Documentul selectat este gol."})).setMimeType(ContentService.MimeType.JSON);

    // Funcție robustă de normalizare
    var clean = function(str) {
      if (!str) return "";
      return String(str)
        .toLowerCase()
        .replace(/[ăâ]/g, "a")
        .replace(/[î]/g, "i")
        .replace(/[șş]/g, "s")
        .replace(/[țţ]/g, "t")
        .replace(/[^a-z0-9]/g, "");
    };

    var magAdresaClean = clean(data.magAdresa);
    var magNumeClean = clean(data.magNume);

    var isIgnoredColumn = function(text) {
      if (!text) return true;
      var cleanCol = clean(text);
      var ignored = ["magazin", "adresa", "nume", "nr", "crt", "index", "id", "localitate", "judet", "route", "telefon", "cod", "client", "mag", "adr"];
      for (var i = 0; i < ignored.length; i++) {
        if (cleanCol === ignored[i]) return true;
      }
      return false;
    };

    var getMatchScore = function(cellText, prodNume) {
      if (!cellText || !prodNume) return 0;
      var cText = String(cellText).toLowerCase();
      var pText = String(prodNume).toLowerCase();
      if (cText === pText) return 100;
      var norm = function(s) {
        return s.normalize("NFD")
                .replace(/[̀-ͯ]/g, "")
                .replace(/[ăâ]/g, "a")
                .replace(/[î]/g, "i")
                .replace(/[șş]/g, "s")
                .replace(/[țţ]/g, "t")
                .replace(/[^a-z0-9 ]/g, " ")
                .replace(/s+/g, " ")
                .trim();
      };
      var nCell = norm(cText);
      var nProd = norm(pText);
      if (nCell === nProd) return 95;
      var compCell = nCell.replace(/s/g, "");
      var compProd = nProd.replace(/s/g, "");
      if (compCell === compProd) return 90;
      if (compCell.indexOf(compProd) !== -1 || compProd.indexOf(compCell) !== -1) return 80;
      var getWords = function(s) { return s.split(" ").filter(function(w) { return w.length >= 2; }); };
      var cellWords = getWords(nCell);
      var prodWords = getWords(nProd);
      if (cellWords.length === 0 || prodWords.length === 0) return 0;
      var matches = 0;
      for (var i = 0; i < prodWords.length; i++) {
        if (cellWords.indexOf(prodWords[i]) !== -1) matches++;
      }
      if (matches > 0) {
        var ratio = matches / Math.max(cellWords.length, prodWords.length);
        return Math.floor(ratio * 70); 
      }
      return 0;
    };

    // 1. Căutare produs
    var colIdx = -1;
    var bestColScore = 0;
    var rowsToSearch = [];
    if (rows[0]) rowsToSearch.push({rowIdx: 0, data: rows[0]});
    if (rows[1]) rowsToSearch.push({rowIdx: 1, data: rows[1]});

    for (var rIdx = 0; rIdx < rowsToSearch.length; rIdx++) {
      var searchRow = rowsToSearch[rIdx].data;
      for (var c = 2; c < searchRow.length; c++) {
        var cellContent = searchRow[c];
        if (!cellContent || isIgnoredColumn(cellContent)) continue;
        var score = getMatchScore(cellContent, data.prodNume);
        if (score > bestColScore && score >= 20) {
          bestColScore = score;
          colIdx = c;
        }
      }
    }

    if (colIdx === -1) return ContentService.createTextOutput(JSON.stringify({error: "Nu am găsit produsul"})).setMimeType(ContentService.MimeType.JSON);

    // 2. Căutare magazin
    var rowIdx = -1;
    var bestRowIdx = -1;
    var bestScore = 0;
    for (var r = 2; r < rows.length; r++) {
      var currentRow = rows[r] || [];
      var cellColA = clean(currentRow[0] || "");
      var cellColB = clean(currentRow[1] || "");
      var currentScore = 0;
      if (cellColB) {
        var hasNume = (magNumeClean && cellColB.indexOf(magNumeClean) !== -1);
        var hasAdresa = (magAdresaClean && cellColB.indexOf(magAdresaClean) !== -1);
        if (hasNume && hasAdresa) currentScore = 100;
        else if (hasAdresa) currentScore = 80;
        else if (hasNume) currentScore = 15;
      }
      var legacyScore = 0;
      if (cellColA && cellColB) {
        if (magNumeClean && cellColA.indexOf(magNumeClean) !== -1 && magAdresaClean && cellColB.indexOf(magAdresaClean) !== -1) legacyScore = 90;
        else if (magAdresaClean && cellColB.indexOf(magAdresaClean) !== -1) legacyScore = 75;
      }
      var finalScore = Math.max(currentScore, legacyScore);
      if (finalScore > bestScore && finalScore >= 70) { bestScore = finalScore; bestRowIdx = r; }
    }

    if (bestRowIdx !== -1) {
      rowIdx = bestRowIdx;
    } else {
      var firstEmptyBIdx = -1;
      for (var r = 2; r < rows.length; r++) { if (!(String(rows[r][1] || "").trim())) { firstEmptyBIdx = r; break; } }
      if (firstEmptyBIdx !== -1) {
        rowIdx = firstEmptyBIdx;
        sheet.getRange(rowIdx + 1, 2).setValue(data.magNume + " - " + data.magAdresa);
      } else {
        sheet.appendRow(["", data.magNume + " - " + data.magAdresa]);
        rowIdx = sheet.getLastRow() - 1;
      }
    }

    // 3. Stilizare Corectată (Aici am schimbat API-ul)
    var cell = sheet.getRange(rowIdx + 1, colIdx + 1);
    cell.clearFormat(); // Eliminăm vechile stiluri
    
    var valueStr = String(data.stocMan);
    var dateFullStr = " (" + data.dateStr + ")";
    var fullText = valueStr + dateFullStr;

    try {
      var richTextBuilder = SpreadsheetApp.newRichTextValue().setText(fullText);

      // Stil Roșu Bold (folosim newTextStyle + setForegroundColor)
      var redBoldStyle = SpreadsheetApp.newTextStyle()
        .setBold(true)
        .setForegroundColor("#ff0000")
        .build();
      richTextBuilder.setTextStyle(0, valueStr.length, redBoldStyle);

      // Stil Negru Normal
      var blackStyle = SpreadsheetApp.newTextStyle()
        .setBold(false)
        .setForegroundColor("#000000")
        .build();
      richTextBuilder.setTextStyle(valueStr.length, fullText.length, blackStyle);

      cell.setRichTextValue(richTextBuilder.build());
    } catch (errRich) {
      cell.setValue(fullText);
    }

    return ContentService.createTextOutput(JSON.stringify({success: true})).setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
    return ContentService.createTextOutput(JSON.stringify({error: err.toString()})).setMimeType(ContentService.MimeType.JSON);
  }
}`}

                        <span>- {magSect.length} {magSect.length === 1 ? 'magazin' : 'magazine'}</span>
                    </div>

                        <i className={`fas ${columns === 1 ? 'fa-th-large' : 'fa-list'} text-[1.2rem]`}></i>
                    </button>

                    {magSect.map(m => (

                            <div className={columns === 2 ? 'pr-[25px]' : 'pr-[40px]'}>
                                <div className={`font-black leading-tight mb-1 ${columns === 2 ? 'text-[1.05rem]' : 'text-[1.2rem]'}`}>{m.nume}</div>
                                <div className={`text-text-sec font-medium leading-tight ${columns === 2 ? 'text-[0.85rem]' : 'text-[0.95rem]'}`}>{m.adresa}</div>
                            </div>
                            <button className={`absolute top-1/2 -translate-y-1/2 bg-transparent border-none text-danger p-2 cursor-pointer hover:scale-110 transition-transform ${columns === 2 ? 'right-[5px] text-[1rem]' : 'right-[15px] text-[1.2rem]'}`} onClick={(e)=>{e.stopPropagation(); confirmAction("Ștergere", "Ștergi magazinul cu toate produsele și loturile sale?", ()=>FirebaseService.deleteStoreCascading(m.id));}}><i className="fas fa-trash"></i></button>

                <ExpirariBox type="sector" data={{currentSectorId: sector.id}} />
                
                <FABSearch onClick={() => openModal(MODAL_TYPES.SEARCH)} />
