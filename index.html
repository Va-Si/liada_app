                <BaseModal isOpen={modal.type === MODAL_TYPES.ADD_STORE} title="Adaugă Magazin">
                    <Input placeholder="Nume Magazin" value={newMag.nume} onChange={e=>setNewMag({...newMag, nume:e.target.value})} />
                    <Input placeholder="Adresă" value={newMag.adresa} onChange={e=>setNewMag({...newMag, adresa:e.target.value})} />
                    <Select value={newMag.retea} onChange={e=>setNewMag({...newMag, retea:e.target.value})}>
                        {reteleMagazine.map((r,i) => <option key={i} value={r.nume}>{r.nume}</option>)}
                    </Select>
                    <div className="flex gap-3 pt-5">
                        <SecondaryButton onClick={closeModal}>Anulează</SecondaryButton>
                        <PrimaryButton onClick={()=>{
                            if(newMag.nume){
                                let objRet = reteleMagazine.find(r=>r.nume===newMag.retea);
                                let cul = objRet ? objRet.culoare : CONFIG.COLORS.DEFAULT_STORE;
                                FirebaseService.add('magazine', {sectorId: sector.id, ...newMag, culoare: cul, order: magSect.length});
                                closeModal();
                            }
                        }}>Salvează</PrimaryButton>
                    </div>
                </BaseModal>

                <BaseModal isOpen={modal.type === MODAL_TYPES.EDIT_SECTOR} title="Editează Sector">
                    <Input placeholder="Nume Sector" value={editSect.nume} onChange={e=>setEditSect({...editSect, nume:e.target.value})} />
                    <Input type="color" value={editSect.culoare} onChange={e=>setEditSect({...editSect, culoare:e.target.value})} className="!h-[50px] !p-[3px] cursor-pointer" />
                    <div className="flex gap-3 pt-5">
                        <SecondaryButton onClick={closeModal}>Anulează</SecondaryButton>
                        <PrimaryButton onClick={()=>{
                            if(editSect.nume){
                                FirebaseService.update('sectoare', sector.id, { nume: editSect.nume, culoare: editSect.culoare });
                                setView({page: PAGES.SECTOR, data: {...sector, nume: editSect.nume, culoare: editSect.culoare}});
                                closeModal();
                            }
                        }}>Salvează</PrimaryButton>
                    </div>
                </BaseModal>
            </div>
        );
    };

    const StorePhotosSection = ({ magazinId, confirmAction }) => {
        const [photos, setPhotos] = useState([]);
        const [loading, setLoading] = useState(true);
        const [uploading, setUploading] = useState(false);
        const [selectedPhoto, setSelectedPhoto] = useState(null);

        useEffect(() => {
            setLoading(true);
            const unsubscribe = db.collection('poze_magazine')
                .where('magazinId', '==', magazinId)
                .onSnapshot(snapshot => {
                    const list = [];
                    snapshot.forEach(doc => {
                        list.push({ id: doc.id, ...doc.data() });
                    });
                    // Sortare locală pentru a evita eroarea de index compus în Firestore
                    list.sort((a, b) => {
                        const tA = a.timestamp?.toMillis ? a.timestamp.toMillis() : (a.timestamp || 0);
                        const tB = b.timestamp?.toMillis ? b.timestamp.toMillis() : (b.timestamp || 0);
                        return tB - tA;
                    });
                    setPhotos(list);
                    setLoading(false);
                }, err => {
                    console.error("Eroare incarcare poze magazin:", err);
                    setLoading(false);
                });
            return () => unsubscribe();
        }, [magazinId]);

        const handleFileSelect = (file) => {
            if (!file) return;
            setUploading(true);
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const MAX_SIZE = 700; // Redimensionare optimă pentru stocare eficientă în Firestore
                    if (width > height) {
                        if (width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        }
                    } else {
                        if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.82); // Compresie excelentă (~35-65 KB)

                    db.collection('poze_magazine').add({
                        magazinId,
                        image: compressedDataUrl,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    })
                    .then(() => {
                        setUploading(false);
                    })
                    .catch(err => {
                        console.error("Eroare salvare poza magazin:", err);
                        setUploading(false);
                        alert("Eroare salvare poză: " + err.message);
                    });
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        const handleDeletePhoto = (photoId, e) => {
            if (e) e.stopPropagation();
            confirmAction("Șterge Poză", "Sigur dorești să ștergi această poză din magazin?", () => {
                db.collection('poze_magazine').doc(photoId).delete()
                    .catch(err => console.error("Eroare stergere poza magazin:", err));
            });
        };

        return (
            <Card className="!p-4 border border-border-color dark:border-dark-border shadow-sm">
                <div className="flex justify-between items-center font-black text-[1.2rem] mb-2">
                    <span className="flex items-center gap-2">
                        <i className="fas fa-images text-accent animate-pulse-fast"></i>
                        Poze magazin / depozit
                    </span>
                    <span className="text-[0.75rem] font-bold text-text-sec bg-blue-50 dark:bg-blue-950/20 p-1.5 rounded-lg border border-blue-100 dark:border-blue-900/30">
                        {photos.length} {photos.length === 1 ? 'poză' : 'poze'}
                    </span>
                </div>

                {loading ? (
                    <div className="flex justify-center items-center py-6">
                        <i className="fas fa-spinner animate-spin text-accent text-[1.5rem]"></i>
                    </div>
                ) : (
                    <div className="grid grid-cols-3 gap-2.5 mt-3">
                        {photos.map(p => (
                            <div 
                                key={p.id} 
                                className="relative aspect-square rounded-xl overflow-hidden bg-gray-50 dark:bg-gray-900 border border-border-color dark:border-dark-border group cursor-pointer hover:opacity-90 active:scale-95 transition-all"
                                onClick={() => setSelectedPhoto(p)}
                            >
                                <img src={p.image} alt="Magazin" className="w-full h-full object-cover rounded-xl" />
                                <button 
                                    onClick={(e) => handleDeletePhoto(p.id, e)}
                                    className="absolute top-1 right-1 w-6 h-6 rounded-full bg-red-500 text-white flex items-center justify-center text-[0.7rem] hover:scale-110 active:scale-95 transition-transform shadow-lg border border-white/20"
                                    title="Șterge poză"
                                >
                                    <i className="fas fa-trash-can"></i>
                                </button>
                            </div>
                        ))}

                        {/* Buton adaugă poză */}
                        <div 
                            onClick={() => document.getElementById('store_photo_file_input').click()}
                            className={`aspect-square rounded-xl border-2 border-dashed flex flex-col items-center justify-center p-2 cursor-pointer transition-all ${
                                uploading 
                                ? 'border-accent bg-blue-50/50 dark:bg-blue-900/10' 
                                : 'border-border-color dark:border-dark-border hover:border-accent hover:bg-gray-50 dark:hover:bg-gray-900/10 active:scale-95'
                            }`}
                        >
                            {uploading ? (
                                <React.Fragment>
                                    <i className="fas fa-spinner animate-spin text-accent text-[1.5rem] mb-1"></i>
                                    <span className="text-[0.65rem] font-black text-accent text-center leading-tight">Încărcare...</span>
                                </React.Fragment>
                            ) : (
                                <React.Fragment>
                                    <i className="fas fa-camera text-accent text-[1.4rem] mb-1"></i>
                                    <span className="text-[0.7rem] font-bold text-text-main dark:text-white text-center leading-tight">Adaugă Poză</span>
                                </React.Fragment>
                            )}
                        </div>
                    </div>
                )}

                <input 
                    type="file" 
                    id="store_photo_file_input" 
                    accept="image/*" 
                    className="hidden" 
                    onChange={e => {
                        if (e.target.files && e.target.files[0]) {
                            handleFileSelect(e.target.files[0]);
                        }
                    }} 
                />

                {/* Lightbox / Modal de vizualizare completă a pozei */}
                {selectedPhoto && (
                    <div 
                        className="fixed inset-0 bg-black/95 z-[1100] flex flex-col justify-between p-4 animate-fade-in backdrop-blur-sm"
                        onClick={() => setSelectedPhoto(null)}
                    >
                        <div className="flex justify-between items-center w-full pt-2">
                            <span className="text-white font-black text-[0.95rem] bg-gray-900/80 p-2 px-3 rounded-xl border border-white/10">
                                Detalii Foto Magazin
                            </span>
                            <button 
                                className="w-10 h-10 rounded-full bg-white/10 text-white flex items-center justify-center hover:bg-white/20 transition-colors"
                                onClick={() => setSelectedPhoto(null)}
                            >
                                <i className="fas fa-times text-lg"></i>
                            </button>
                        </div>

                        <div className="flex-1 flex items-center justify-center p-2 max-h-[85vh]">
                            <img 
                                src={selectedPhoto.image} 
                                alt="Vizualizare completă" 
                                className="max-w-[100vw] max-h-[75vh] object-contain rounded-xl shadow-2xl border border-white/15"
                                onClick={(e) => e.stopPropagation()} 
                            />
                        </div>

                        <div className="flex gap-3 justify-center pb-4 pt-2">
                            <button 
                                onClick={(e) => {
                                    e.stopPropagation();
                                    const idToDelete = selectedPhoto.id;
                                    setSelectedPhoto(null);
                                    handleDeletePhoto(idToDelete);
                                }}
                                className="bg-red-600 hover:bg-red-700 text-white font-black rounded-xl p-3.5 text-[0.85rem] uppercase cursor-pointer transition-colors flex items-center gap-2 px-6 shadow-xl"
                            >
                                <i className="fas fa-trash"></i> Șterge această poză
                            </button>
                        </div>
                    </div>
                )}
            </Card>
        );
    };

    const StorePage = () => {
        const { view, setView, dbMagazine, dbProduse, catalogCategorii, reteleMagazine, proprietatiMagazine, dbSectoare, confirmAction, modal, openModal, closeModal } = useApp();
        const rawMagazin = view.data.magazin;
        const sector = view.data.sector;
        const magazin = dbMagazine[rawMagazin.id] || rawMagazin; 
        
        const prodInMag = Object.values(dbProduse).filter(p => p.magazinId === magazin.id);
        const prodGrupate = {}; Object.keys(catalogCategorii).forEach(c => prodGrupate[c]=[]);
        
        prodInMag.forEach(p => { 
            if(prodGrupate[p.categorie]) prodGrupate[p.categorie].push(p); 
        });

        // Sortează produsele în magazin exact în ordinea specificată de user în catalogul din Setări
        Object.keys(prodGrupate).forEach(cat => {
            const catInfo = catalogCategorii[cat];
            if (catInfo && catInfo.produse) {
                prodGrupate[cat].sort((a, b) => {
                    let indexA = catInfo.produse.indexOf(a.nume);
                    let indexB = catInfo.produse.indexOf(b.nume);
                    if (indexA === -1) indexA = 999;
                    if (indexB === -1) indexB = 999;
                    return indexA - indexB;
                });
            }
        });

        const [openCats, setOpenCats] = useState({});
        const toggleCat = (c) => setOpenCats(prev => ({...prev, [c]: !prev[c]}));

        const [editStore, setEditStore] = useState({ nume: magazin.nume, adresa: magazin.adresa, retea: magazin.retea, sectorId: magazin.sectorId });
        const [newProdState, setNewProdState] = useState({ cat: '', nume: '' });
        const [selectedProductsForAdd, setSelectedProductsForAdd] = useState([]);
        const [searchProductQuery, setSearchProductQuery] = useState('');
        const allSectoare = Object.values(dbSectoare);
        
        const [propVals, setPropVals] = useState(magazin.proprietati || {});
        useEffect(() => { setPropVals(magazin.proprietati || {}); }, [magazin.proprietati]);

        useEffect(() => {
            if (modal.type === MODAL_TYPES.ADD_PRODUCT && modal.data) {
                setNewProdState({ cat: modal.data.cat || '', nume: '' });
                setSelectedProductsForAdd([]);
                setSearchProductQuery('');
            }
        }, [modal.type, modal.data]);

        return (
            <div className="animate-fade-in pb-[100px]">
                <FrozenHeader title={magazin.nume} subtitle={magazin.adresa} bgColor={magazin.culoare || CONFIG.COLORS.DEFAULT_STORE} actions={
                    <React.Fragment>
                        <ButtonIcon icon="fas fa-pen text-white" onClick={()=>{ setEditStore({nume: magazin.nume, adresa: magazin.adresa, retea: magazin.retea, sectorId: magazin.sectorId}); openModal(MODAL_TYPES.EDIT_STORE); }}/>
                        <ButtonIcon icon="fas fa-arrow-left text-white" onClick={()=>setView({page: PAGES.SECTOR, data: sector})}/>
                        <ButtonIcon icon="fas fa-home text-white" onClick={()=>setView({page: PAGES.MAIN})}/>
                    </React.Fragment>
                } />
                
                <Card>
                    <div className="font-bold text-[1.1rem] mb-3">Detalii despre magazin</div>
                    {proprietatiMagazine.map((p,i) => (
                        <CardRow key={i}>
                            <span>{p}:</span> 
                            <Input 
                                placeholder={`${p}...`} 
                                className="!w-[60%] !mt-0 !p-2" 
                                value={propVals[p] || ''} 
                                onChange={(e) => setPropVals(prev => ({...prev, [p]: e.target.value}))}
                                onBlur={() => FirebaseService.update('magazine', magazin.id, { proprietati: propVals })}
                            />
                        </CardRow>
                    ))}
                </Card>

                <StorePhotosSection magazinId={magazin.id} confirmAction={confirmAction} />

                <div>
                    {/* Sortează și afișează categoriile conform ordinii dorite */}
                    {Object.entries(prodGrupate).sort(([catA], [catB]) => {
                        const orderA = catalogCategorii[catA]?.order !== undefined ? catalogCategorii[catA].order : PREFERRED_CAT_ORDER.indexOf(catA);
                        const orderB = catalogCategorii[catB]?.order !== undefined ? catalogCategorii[catB].order : PREFERRED_CAT_ORDER.indexOf(catB);
                        const indA = orderA === -1 ? 999 : orderA;
                        const indB = orderB === -1 ? 999 : orderB;
                        return indA - indB;
                    }).map(([cat, produse]) => {
                        const isDeschis = openCats[cat] !== undefined ? openCats[cat] : produse.length > 0;
                        return (
                            <Card key={cat} className="!p-0 overflow-hidden">
                                <div className="flex justify-between items-center font-black text-[1.1rem] cursor-pointer p-5 bg-gray-50 dark:bg-gray-800/50" onClick={()=>toggleCat(cat)}>
                                    {cat}
                                    <div className="flex items-center gap-[15px]">
                                        <ButtonIcon icon="fas fa-plus" className="!text-accent !bg-blue-100 dark:!bg-blue-900/50 !rounded-full !p-[6px_8px] !text-[0.9rem]" onClick={(e)=>{e.stopPropagation(); setNewProdState({cat: cat, nume: ''}); openModal(MODAL_TYPES.ADD_PRODUCT, {cat: cat, nume: ''});}} />
                                        <i className={`fas fa-chevron-down text-border-color transition-transform ${isDeschis ? 'rotate-0' : 'rotate-90'}`}></i>
                                    </div>
                                </div>
                                <div style={{display: isDeschis ? 'block' : 'none'}}>
                                    {produse.length === 0 ? <div className="text-center text-text-sec text-[0.9rem] p-5 font-medium border-t border-border-color dark:border-dark-border">Niciun produs adăugat.</div> : null}
                                    {produse.map((p, idx) => (
                                        <div key={p.id} className="cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800/50 transition-colors" onClick={()=>setView({page: PAGES.PRODUCT, data: { id: p.id, nume: p.nume, categorie: cat, magazinCuloare: magazin.culoare, magazinNume: magazin.nume, magazinAdresa: magazin.adresa, backData: {magazin: magazin, sector: sector} }})}>
                                            <div className={`flex justify-between items-center py-3 mx-5 ${idx > 0 ? 'border-t-2 border-gray-200 dark:border-gray-700' : 'border-t-2 border-transparent'}`}>
                                                <span className="font-bold text-[1.05rem] flex items-center gap-2">
                                                    {p.nume}
                                                    <ButtonIcon 
                                                        icon="fas fa-barcode text-accent" 
                                                        className="!text-[0.95rem] !p-1" 
                                                        onClick={(e)=>{e.stopPropagation(); openModal(MODAL_TYPES.PRODUCT_IMAGE, { catName: p.categorie, prodName: p.nume });}} 
                                                    />
                                                </span>
                                                <div className="flex items-center">
                                                    <ButtonDanger icon="fas fa-trash" className="mr-[10px] !text-[1.1rem]" onClick={(e)=>{e.stopPropagation(); confirmAction("Șterge","Ștergi produsul cu toate loturile sale?", ()=>FirebaseService.deleteProductCascading(p.id));}} />
                                                    <i className="fas fa-chevron-right text-border-color"></i>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </Card>
                        );
                    })}
                </div>

                <ExpirariBox type="store" data={{currentStoreId: magazin.id}} />

                <FABSearch onClick={() => openModal(MODAL_TYPES.SEARCH)} />

                <BaseModal isOpen={modal.type === MODAL_TYPES.ADD_PRODUCT} title={`Adaugă în: ${newProdState.cat}`}>
                    {(() => {
                        const existingProdNames = Object.values(dbProduse)
                            .filter(p => p.magazinId === magazin.id && p.categorie === newProdState.cat)
                            .map(p => p.nume.trim().toLowerCase());

                        const allCatalogProds = catalogCategorii[newProdState.cat]?.produse || [];
                        const filteredProds = allCatalogProds.filter(p => 
                            p.toLowerCase().includes(searchProductQuery.toLowerCase())
                        );

                        return (
                            <React.Fragment>
                                <div className="mb-3">
                                    <Input 
                                        placeholder="Caută produs în catalog..." 
                                        value={searchProductQuery}
                                        onChange={e => setSearchProductQuery(e.target.value)}
                                        className="!mb-2"
                                    />
                                    
                                    <div className="flex gap-2.5 text-[0.75rem] font-bold text-text-sec">
                                        <button 
                                            type="button"
                                            className="text-accent hover:underline cursor-pointer"
                                            onClick={() => {
                                                const newToSelect = allCatalogProds.filter(p => 
                                                    !existingProdNames.includes(p.trim().toLowerCase())
                                                );
                                                setSelectedProductsForAdd(newToSelect);
                                            }}
                                        >
                                            Selectează toate nesalvate
                                        </button>
                                        <span>|</span>
                                        <button 
                                            type="button"
                                            className="hover:underline cursor-pointer"
                                            onClick={() => setSelectedProductsForAdd([])}
                                        >
                                            Deselectează tot
                                        </button>
                                    </div>
                                </div>

                                <div className="max-h-[280px] overflow-y-auto border border-border-color dark:border-dark-border rounded-xl p-2 bg-gray-50/30 dark:bg-gray-900/10 space-y-1">
                                    {filteredProds.length === 0 ? (
                                        <div className="text-center text-text-sec text-[0.85rem] py-4">
                                            Niciun produs găsit.
                                        </div>
                                    ) : (
                                        filteredProds.map((p, i) => {
                                            const isAdded = existingProdNames.includes(p.trim().toLowerCase());
                                            const isChecked = selectedProductsForAdd.includes(p);
                                            
                                            return (
                                                <div 
                                                    key={i}
                                                    onClick={() => {
                                                        if (isAdded) return;
                                                        if (isChecked) {
                                                            setSelectedProductsForAdd(prev => prev.filter(name => name !== p));
                                                        } else {
                                                            setSelectedProductsForAdd(prev => [...prev, p]);
                                                        }
                                                    }}
                                                    className={`flex items-center gap-2.5 p-2 px-3 rounded-lg border transition-all cursor-pointer ${
                                                        isAdded 
                                                        ? 'opacity-50 bg-gray-100 dark:bg-gray-800/10 border-transparent cursor-not-allowed'
                                                        : isChecked
                                                        ? 'bg-blue-50/50 dark:bg-blue-950/20 border-accent/40 text-text-main dark:text-white'
                                                        : 'bg-white dark:bg-dark-surface border-border-color dark:border-dark-border text-text-sec hover:bg-gray-50 dark:hover:bg-gray-800/50'
                                                    }`}
                                                >
                                                    <input 
                                                        type="checkbox"
                                                        className="rounded text-accent focus:ring-accent cursor-pointer disabled:cursor-not-allowed"
                                                        checked={isAdded || isChecked}
                                                        disabled={isAdded}
                                                        readOnly
                                                    />
                                                    <div className="flex justify-between items-center w-full">
                                                        <span className="text-[0.85rem] font-bold">{p}</span>
                                                        {isAdded && (
                                                            <span className="text-[0.7rem] bg-gray-100 dark:bg-gray-800 text-text-sec px-1.5 py-0.5 rounded-md font-bold">
                                                                deja adăugat
                                                            </span>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>

                                <div className="mt-4 flex items-center justify-between text-[0.8rem] text-text-sec font-bold">
                                    <span>Produse selectate pentru adăugare:</span>
                                    <span className="bg-accent/10 text-accent p-1 px-2.5 rounded-lg">

                                <div className="flex gap-3 pt-5 border-t border-dashed border-border-color dark:border-dark-border mt-4">

                                        disabled={selectedProductsForAdd.length === 0}
                                        onClick={() => {
                                            if (selectedProductsForAdd.length === 0) return;
                                            
                                            selectedProductsForAdd.forEach(prodName => {
                                                FirebaseService.add('produse_magazin', {
                                                    magazinId: magazin.id,
                                                    categorie: newProdState.cat,
                                                    nume: prodName
                                                });
                                            });

                                            closeModal();
                                        }}
                                    >
                                        Adaugă ({selectedProductsForAdd.length})
                                    </PrimaryButton>

                </BaseModal>

                <BaseModal isOpen={modal.type === MODAL_TYPES.EDIT_STORE} title="Editează Magazin">
                    <Input placeholder="Nume" value={editStore.nume} onChange={e=>setEditStore({...editStore, nume:e.target.value})} />
                    <Input placeholder="Adresă" value={editStore.adresa} onChange={e=>setEditStore({...editStore, adresa:e.target.value})} />
                    <div className="mt-2 text-[0.85rem] font-bold text-text-sec ml-1">Rețea:</div>
                    <Select value={editStore.retea} onChange={e=>setEditStore({...editStore, retea:e.target.value})} className="!mt-0">
                        {reteleMagazine.map((r,i) => <option key={i} value={r.nume}>{r.nume}</option>)}
                    </Select>
                    <div className="mt-2 text-[0.85rem] font-bold text-text-sec ml-1">Sector (Mutare):</div>
                    <Select value={editStore.sectorId} onChange={e=>setEditStore({...editStore, sectorId:e.target.value})} className="!mt-0">
                        {allSectoare.map(s => <option key={s.id} value={s.id}>{s.nume}</option>)}
                    </Select>
                    <div className="flex gap-3 pt-5">
                        <SecondaryButton onClick={closeModal}>Anulează</SecondaryButton>
                        <PrimaryButton onClick={()=>{
                            if(editStore.nume){
                                let objRet = reteleMagazine.find(r=>r.nume===editStore.retea);
                                let cul = objRet ? objRet.culoare : CONFIG.COLORS.DEFAULT_STORE;
                                FirebaseService.update('magazine', magazin.id, { nume: editStore.nume, adresa: editStore.adresa, retea: editStore.retea, sectorId: editStore.sectorId, culoare: cul });
                                
                                if(editStore.sectorId !== magazin.sectorId) setView({page: PAGES.SECTOR, data: sector}); 
                                else setView({page: PAGES.STORE, data: { magazin: {...magazin, nume: editStore.nume, adresa: editStore.adresa, retea: editStore.retea, culoare: cul}, sector }});
                                closeModal();
                            }
                        }}>Salvează</PrimaryButton>
                    </div>
                </BaseModal>
            </div>
        );
    };

    // --- Sub-componentă curată pentru Rândurile de Loturi ---
    const LotRow = ({ l, isDrojdii, catObj, confirmAction, onUpdate }) => {
        const [cantitate, setCantitate] = useState(l.cantitate === 0 ? '' : l.cantitate);
        const [dataExp, setDataExp] = useState(l.dataExp || '');
        const [dataProd, setDataProd] = useState(l.dataProd || '');

        useEffect(() => { setCantitate(l.cantitate === 0 ? '' : l.cantitate); }, [l.cantitate]);
        useEffect(() => { setDataExp(l.dataExp || ''); }, [l.dataExp]);
        useEffect(() => { setDataProd(l.dataProd || ''); }, [l.dataProd]);

        const handleQtyBlur = () => {
            let val = parseInt(cantitate);
            if (isNaN(val) || val < 0) val = 0;
            setCantitate(val === 0 ? '' : val);
            if (val !== l.cantitate) {
                FirebaseService.update('loturi', l.id, { cantitate: val });
                onUpdate();
            }
        };

        const handleExpBlur = () => {
            if (!/^\d{2}\.\d{2}\.\d{4}$/.test(dataExp)) {
                alert("Format invalid! Introduceți ZZ.LL.AAAA (ex: 15.08.2025)");
                setDataExp(l.dataExp);
                return;
            }
            if (dataExp !== l.dataExp) {
                FirebaseService.update('loturi', l.id, { dataExp });
                onUpdate();
            }
        };

        const handleProdBlur = () => {
            if (!/^\d{2}\.\d{2}\.\d{4}$/.test(dataProd)) {
                alert("Format invalid! Introduceți ZZ.LL.AAAA (ex: 15.08.2025)");
                setDataProd(l.dataProd);
                return;
            }
            if (dataProd !== l.dataProd) {
                let expCalc = Helpers.calculeazaExpirare(dataProd, catObj);
                if (expCalc !== "Dată invalidă") {
                    FirebaseService.update('loturi', l.id, { dataProd, dataExp: expCalc });
                    onUpdate();
                } else {
                    alert("Dată invalidă calculată!");
                    setDataProd(l.dataProd);
                }
            }
        };

        return (
            <div className="flex justify-between items-center bg-bg-color dark:bg-dark-bg p-2.5 rounded-xl mt-3 border border-border-color dark:border-dark-border shadow-sm">
                <div className="flex flex-col items-center">
                    <span className="text-[0.7rem] font-bold text-text-sec uppercase">Buc</span>
                    <input type="number" min="0" placeholder="0" value={cantitate} onChange={e => setCantitate(e.target.value)} onBlur={handleQtyBlur} className="w-[50px] text-center p-1 mt-1 font-black text-[1.05rem] border border-border-color dark:border-dark-border rounded-lg bg-surface-color dark:bg-dark-surface text-text-main dark:text-white outline-none focus:border-accent" />
                </div>
                <div className="flex flex-col items-center px-1">
                    <span className="text-[0.7rem] font-bold text-text-sec uppercase">Expiră pe</span>
                    {isDrojdii ? (
                        <input type="text" value={dataExp} onChange={e => setDataExp(e.target.value)} onBlur={handleExpBlur} className="text-danger font-black w-[95px] text-center p-1 mt-1 text-[0.95rem] tracking-tighter border border-border-color dark:border-dark-border rounded-lg bg-surface-color dark:bg-dark-surface outline-none focus:border-accent" />
                    ) : (
                        <strong className="text-danger font-black text-[1rem] mt-2 tracking-tighter">{dataExp}</strong>
                    )}
                </div>
                <div className="flex flex-col items-center px-1">
                    <span className="text-[0.7rem] font-bold text-text-sec uppercase">Data Prod.</span>
                    {isDrojdii ? (
                        <span className="text-[0.85rem] font-bold text-border-color mt-2">N/A</span>
                    ) : (
                        <input type="text" value={dataProd} onChange={e => setDataProd(e.target.value)} onBlur={handleProdBlur} className="w-[95px] text-center p-1 mt-1 font-bold text-[0.95rem] tracking-tighter border border-border-color dark:border-dark-border rounded-lg bg-surface-color dark:bg-dark-surface text-text-main dark:text-white outline-none focus:border-accent" />
                    )}
                </div>
                <ButtonDanger icon="fas fa-times-circle" className="!text-[1.3rem] !p-1" onClick={() => confirmAction("Șterge Lot", "Sigur?", () => { FirebaseService.delete('loturi', l.id); onUpdate(); })} />
            </div>
        );
    };

    const ProductPage = () => {
        const { view, setView, catalogCategorii, dbMagazine, dbProduse, dbLoturi, confirmAction, modal, openModal, closeModal, googleSpreadsheetId, googleSheetName, googleAppsScriptUrl } = useApp();
        
        const rawProd = view.data;
        const prod = { ...rawProd, ...(dbProduse[rawProd.id] || {}) }; 
        const activeMag = dbMagazine[prod.magazinId] || { nume: prod.magazinNume, adresa: prod.magazinAdresa, culoare: prod.magazinCuloare };

        const isDrojdii = prod.categorie === 'Drojdii';
        const catObj = catalogCategorii[prod.categorie];
        
        const loturiCurente = useMemo(() => {
            return Object.values(dbLoturi).filter(l => l.produsId === prod.id).map(lot => {
                let l = {...lot};
                if(!isDrojdii && l.dataProd && l.dataProd !== "N/A") {
                    let expCalc = Helpers.calculeazaExpirare(l.dataProd, catObj);
                    if(expCalc !== "Dată invalidă") {
                        l.dataExp = expCalc;
                    }
                }
                return l;
            }).sort((a,b) => Helpers.convertDataToTime(a.dataExp) - Helpers.convertDataToTime(b.dataExp));
        }, [dbLoturi, prod.id, isDrojdii, catObj]);

        const totalVitrina = loturiCurente.reduce((sum, l) => sum + (parseInt(l.cantitate)||0), 0);
        
        // Stoc Manual & Depozit (Inițializare smart pt 0 gol)
        const [stocMan, setStocMan] = useState(prod.stocManual === 0 ? 0 : (prod.stocManual || ''));
        useEffect(() => { setStocMan(prod.stocManual === 0 ? 0 : (prod.stocManual || '')); }, [prod.stocManual]);

        const [depozit, setDepozit] = useState(prod.depozit || '');
        useEffect(() => { setDepozit(prod.depozit || ''); }, [prod.depozit]);

        const [notite, setNotite] = useState(prod.notite || '');
        useEffect(() => { setNotite(prod.notite || ''); }, [prod.notite]);

        const [newLot, setNewLot] = useState({ qty: '', data: '' });
        const dateInputRef = useRef(null); // Referință pentru calendar input programatic

        const [isSyncing, setIsSyncing] = useState(false);

        const saveStockToGoogleSheets = async () => {
            if (stocMan === undefined || stocMan === null || stocMan === '') {
                alert("Introduceți o cifră validă la stoc manual înainte de a trimite.");
                return;
            }

            // Generăm formatul datei cerut: zz.ll.aa în paranteze după numărul introdus
            const d = new Date();
            const zz = String(d.getDate()).padStart(2, '0');
            const ll = String(d.getMonth() + 1).padStart(2, '0');
            const aa = String(d.getFullYear()).slice(-2);
            const formatData = `${zz}.${ll}.${aa}`;

            if (!googleAppsScriptUrl) {
                alert("Adresa URL Google Apps Script nu este configurată. Vă rugăm să o adăugați mai întâi în ecranul de Setări.");
                return;
            }
            setIsSyncing(true);
            try {
                // Trimitere către Google Apps Script ca text/plain pentru a ocoli preflight CORS în mod securizat
                const res = await fetch(googleAppsScriptUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8'
                    },
                    body: JSON.stringify({
                        sheetName: googleSheetName || 'Sheet1',
                        prodNume: prod.nume,
                        magNume: activeMag.nume,
                        magAdresa: activeMag.adresa,
                        stocMan: stocMan,
                        dateStr: formatData
                    })
                });

                if (!res.ok) {
                    throw new Error(`Răspuns server necorespunzător: ${res.statusText}`);
                }

                const resText = await res.text();
                let resData;
                try {
                    resData = JSON.parse(resText);
                } catch(e) {
                    throw new Error("Răspunsul primit de la Google Script nu este în format JSON valid.");
                }

                if (resData.error) {
                    throw new Error(resData.error);
                }

                alert(`Stocul manual (${stocMan}) a fost salvat cu succes în tabelul Google Sheets!`);
            } catch (err) {
                console.error("Eroare Apps Script:", err);
                alert(`Eroare la scriere în Sheets (Apps Script): ${err.message}`);
            } finally {
                setIsSyncing(false);
            }
        };

        const [actualizatData, setActualizatData] = useState(() => {
            const acum = new Date();
            return acum.toLocaleDateString('ro-RO') + ' ' + acum.toLocaleTimeString('ro-RO', {hour:'2-digit', minute:'2-digit'});
        });
        
        const triggerUpdate = () => {
            const acum = new Date();
            setActualizatData(acum.toLocaleDateString('ro-RO') + ' ' + acum.toLocaleTimeString('ro-RO', {hour:'2-digit', minute:'2-digit'}));
        };
        
        return (
            <div className="animate-fade-in pb-[100px]">
                <FrozenHeader title={prod.nume} subtitle={`${activeMag.nume} - ${activeMag.adresa}`} bgColor={activeMag.culoare || CONFIG.COLORS.DEFAULT_STORE} actions={
                    <React.Fragment>
                        <ButtonIcon icon="fas fa-barcode text-white" onClick={() => openModal(MODAL_TYPES.PRODUCT_IMAGE, { catName: prod.categorie, prodName: prod.nume })} />
                        <ButtonIcon icon="fas fa-arrow-left text-white" onClick={()=>setView({page: PAGES.STORE, data: prod.backData || { magazin: activeMag, sector: { id: activeMag.sectorId, nume: 'Sector' } }})}/>
                        <ButtonIcon icon="fas fa-home text-white" onClick={()=>setView({page: PAGES.MAIN})}/>
                    </React.Fragment>
                } />
                
                <Card>
                    <textarea 
                        className="w-full p-4 border border-border-color dark:border-dark-border rounded-xl bg-bg-color dark:bg-dark-bg font-medium outline-none focus:border-accent text-text-main dark:text-white" 
                        placeholder="Notițe de făcut..." rows="2"
                        value={notite}
                        onChange={(e) => setNotite(e.target.value)}
                        onBlur={() => { FirebaseService.update('produse_magazin', prod.id, { notite }); triggerUpdate(); }}
                    ></textarea>
                </Card>

                <Card>
                    <div className="font-black text-[1.2rem] mb-2">Cantitatea</div>
                    <div className="flex items-start gap-3 mt-3 w-full">
                        <span className="font-bold mt-2.5 hover:cursor-default shrink-0 text-text-main dark:text-white">Depozit:</span>
                        <textarea 
                            className="flex-1 p-3 border border-border-color dark:border-dark-border rounded-xl bg-bg-color dark:bg-dark-bg font-medium outline-none focus:border-accent text-text-main dark:text-white resize-y min-h-[55px]" 
                            placeholder="Introduceți stoc depozit..." 
                            rows="2"
                            value={depozit}
                            onChange={e=>setDepozit(e.target.value)}
                            onBlur={()=>{ FirebaseService.update('produse_magazin', prod.id, { depozit }); triggerUpdate(); }}
                        ></textarea>
                    </div>
                    <div className="grid grid-cols-2 gap-3 mt-4">
                        <div className="bg-bg-color dark:bg-dark-bg p-3 rounded-xl text-center border border-border-color dark:border-dark-border shadow-sm">
                            <span className="block text-[0.8rem] font-bold text-text-sec uppercase tracking-wide mb-1">Vitrină (Sumă)</span>
                            <div className="text-[1.8rem] font-black text-accent">{totalVitrina}</div>
                        </div>
                        <div className="bg-bg-color dark:bg-dark-bg p-3 rounded-xl text-center border border-border-color dark:border-dark-border shadow-sm">
                            <span className="block text-[0.8rem] font-bold text-text-sec uppercase tracking-wide mb-1">Stoc (Manual)</span>
                            <div className="flex items-center justify-center gap-1 mt-1">
                                <input 
                                    type="number" min="0" placeholder="0" 
                                    className="w-[60%] text-center border-none bg-transparent font-black text-[1.4rem] text-text-main dark:text-white outline-none" 
                                    value={stocMan} 
                                    onChange={e=>setStocMan(e.target.value)} 
                                    onBlur={()=>{ 
                                        if (stocMan === '') {
                                            setStocMan('');
                                            FirebaseService.update('produse_magazin', prod.id, { stocManual: null });
                                        } else {
                                            let val = parseInt(stocMan); if(isNaN(val)||val<0) val=0; 
                                            setStocMan(val); 
                                            FirebaseService.update('produse_magazin', prod.id, { stocManual: val }); 
                                        }
                                        triggerUpdate();
                                    }} 
                                />
                                <button 
                                    onClick={saveStockToGoogleSheets} 
                                    disabled={isSyncing}
                                    title="Trimite stocul în Google Sheets"
                                    className={`text-white rounded-lg p-[8px_12px] shadow-md transition-all border-none ${
                                        isSyncing 
                                        ? 'bg-emerald-400 cursor-not-allowed animate-pulse' 
                                        : 'bg-[#0088cc] hover:bg-[#0077b3] cursor-pointer'
                                    }`}
                                >
                                    {isSyncing ? (
                                        <i className="fas fa-spinner fa-spin"></i>
                                    ) : (
                                        <i className="fas fa-paper-plane"></i>
                                    )}
                                </button>
                            </div>
                        </div>
                    </div>
                </Card>

                <Card>
                    <div className="flex justify-between items-center font-black text-[1.2rem] mb-2">
                        Loturi Valabilitate
                        <div className="flex items-center gap-2">
                            <span className="text-[0.7rem] font-bold text-text-sec bg-gray-100 dark:bg-gray-800 p-1.5 rounded-lg tracking-tight">Act - {actualizatData}</span>
                            <ButtonIcon icon="fas fa-plus" className="!text-accent !bg-blue-100 dark:!bg-blue-900/50 !rounded-full !p-[6px_8px] !text-[1rem]" onClick={() => { setNewLot({qty: '', data: ''}); openModal(MODAL_TYPES.ADD_LOT); }} />
                        </div>
                    </div>
                    <div>
                        {loturiCurente.map(l => (
                            <LotRow key={l.id} l={l} isDrojdii={isDrojdii} catObj={catObj} confirmAction={confirmAction} onUpdate={triggerUpdate} />
                        ))}
                    </div>
                </Card>

                <BaseModal isOpen={modal.type === MODAL_TYPES.ADD_LOT} title="Adaugă Lot Nou">
                    <Input type="number" min="0" placeholder="Cantitate (opțional)" value={newLot.qty} onChange={e=>setNewLot({...newLot, qty:e.target.value})} />
                    <div className="flex gap-[10px] items-center mt-2 w-full">
                        <Input placeholder="Data (ZZ.LL.AAAA)" value={newLot.data} onChange={e=>setNewLot({...newLot, data:e.target.value})} className="flex-1" />
                        <div 
                            onClick={() => {
                                if (dateInputRef.current) {
                                    if (typeof dateInputRef.current.showPicker === 'function') {
                                        try { dateInputRef.current.showPicker(); } catch (err) { dateInputRef.current.click(); }
                                    } else {
                                        dateInputRef.current.click();
                                    }
                                }
                            }}
                            className="relative flex items-center justify-center p-3 border border-border-color dark:border-dark-border rounded-xl bg-bg-color dark:bg-dark-bg text-accent h-[50px] mt-1 cursor-pointer w-[50px] flex-shrink-0"
                        >
                            <i className="fas fa-calendar-alt text-xl pointer-events-none"></i>
                            <input 
                                ref={dateInputRef}
                                type="date" 
                                className="absolute inset-0 w-full h-full opacity-0 pointer-events-none" 
                                onChange={e=>{
                                    if(!e.target.value) return; 
                                    let d=new Date(e.target.value); 
                                    setNewLot({...newLot, data: `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`});
                                }} 
                            />
                        </div>
                    </div>
                    <div className={`text-[0.85rem] mt-2 text-center font-bold ${isDrojdii ? 'text-danger' : 'text-text-sec'}`}>
                        {isDrojdii ? 'Se cere Data Expirării (ZZ.LL.AAAA)' : 'Se cere Data Prod. (ZZ.LL.AAAA)'}
                    </div>
                    <div className="flex gap-3 pt-5">
                        <SecondaryButton onClick={closeModal}>Anulează</SecondaryButton>
                        <PrimaryButton onClick={()=>{
                            if(newLot.data) {
                                if (!/^\d{2}\.\d{2}\.\d{4}$/.test(newLot.data)) {
                                    alert("Format invalid! Introduceți ZZ.LL.AAAA (ex: 15.08.2025)");
                                    return;
                                }
                                let valQ = parseInt(newLot.qty); if(isNaN(valQ) || valQ < 0) valQ = 0;
                                let expStr = isDrojdii ? newLot.data : Helpers.calculeazaExpirare(newLot.data, catObj);
                                let prodStr = isDrojdii ? "N/A" : newLot.data;
                                FirebaseService.add('loturi', {produsId: prod.id, cantitate: valQ, dataProd: prodStr, dataExp: expStr});
                                triggerUpdate();
                                closeModal();
                            } else { alert('Introduceți măcar data!'); }
                        }}>Salvează</PrimaryButton>
                    </div>
                </BaseModal>
            </div>
        );
    };

    const SearchModal = ({ isOpen, onClose, dbMagazine, dbSectoare, setView }) => {
        const [query, setQuery] = useState('');
        
        const results = useMemo(() => {
            if (!query.trim()) return [];
            const q = query.toLowerCase();
            return Object.values(dbMagazine).filter(m => {
                const nameMatch = m.nume && m.nume.toLowerCase().includes(q);
                const addressMatch = m.adresa && m.adresa.toLowerCase().includes(q);
                return nameMatch || addressMatch;
            });
        }, [query, dbMagazine]);

        return (
            <BaseModal isOpen={isOpen} title="Caută Magazin">
                <div className="flex flex-col gap-3">
                    <Input 
                        placeholder="Nume magazin sau adresă..." 
                        value={query} 
                        onChange={e => setQuery(e.target.value)} 
                        autoFocus 
                    />
                    <div className="max-h-[300px] overflow-y-auto mt-2 flex flex-col gap-2">
                        {query.trim() && results.length === 0 ? (
                            <div className="text-center text-text-sec text-[0.9rem] p-4 font-medium">Nu s-a găsit niciun magazin.</div>
                        ) : null}
                        {results.map(m => {
                            const sec = dbSectoare[m.sectorId] || { nume: 'N/A', culoare: '#666' };
                            return (
                                <div 
                                    key={m.id} 
                                    onClick={() => {
                                        setView({ page: PAGES.STORE, data: { magazin: m, sector: sec } });
                                        onClose();
                                        setQuery('');
                                    }}
                                    className="p-3 border border-border-color dark:border-dark-border rounded-xl cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors flex justify-between items-center"
                                >
                                    <div className="flex-1 pr-2 text-left">
                                        <div className="font-bold text-[1.05rem] text-text-main dark:text-white flex items-center gap-2">
                                            <span className="w-3.5 h-3.5 rounded-full inline-block shrink-0" style={{ backgroundColor: m.culoare }} />
                                            {m.nume}
                                        </div>
                                        <div className="text-[0.85rem] text-text-sec font-medium mt-1">{m.adresa}</div>
                                    </div>
                                    <span className="text-[0.75rem] font-black text-white px-2.5 py-1 rounded-full uppercase shrink-0" style={{ backgroundColor: sec.culoare }}>
                                        {sec.nume}
                                    </span>
                                </div>
                            );
                        })}
                    </div>
                    <div className="flex justify-end mt-2">
                        <SecondaryButton onClick={() => { onClose(); setQuery(''); }} className="!flex-initial px-5">Închide</SecondaryButton>
                    </div>
                </div>
            </BaseModal>
        );
    };

    // ==========================================
    // 8. MAIN APP
    // ==========================================
    const MainApp = () => {
        const { isReady, view, setView, modal, openModal, closeModal, dbMagazine, dbSectoare, reteleMagazine, updateRetele, handleExportBackup } = useApp();
        const [editRetState, setEditRetState] = useState({ nume: '', culoare: '' });
        const [selectedBackupScope, setExportScope] = useState('settings');
        
        useEffect(() => {
            if (modal.type === MODAL_TYPES.EDIT_RET && modal.data) {
                setEditRetState({ nume: modal.data.nume, culoare: modal.data.culoare });
            }
        }, [modal]);

        return (
            <React.Fragment>
                {!isReady && (
                    <div className="fixed inset-0 bg-bg-color dark:bg-dark-bg z-[9999] flex flex-col items-center justify-center transition-opacity duration-300">
                        <img src="https://cdn-icons-png.flaticon.com/512/1356/1356559.png" alt="Liada Logo" className="w-[120px] h-[120px] animate-pulse-fast mb-5 drop-shadow-lg" />
                        <h1 className="font-[900] text-[#ff3b30] text-[2.2rem] m-0 tracking-[2px]">LIADA</h1>
                    </div>
                )}
                
                {view.page === PAGES.MAIN && <MainPage />}
                {view.page === PAGES.SETTINGS && <SettingsPage />}
                {view.page === PAGES.SECTOR && <SectorPage />}
                {view.page === PAGES.STORE && <StorePage />}
                {view.page === PAGES.PRODUCT && <ProductPage />}

                {/* GLOBAL MODALS (Prompt, Confirm, Editare globală rețea) */}
                <BaseModal isOpen={modal.type === MODAL_TYPES.EDIT_RET} title="Editează Rețea">
                    <Input placeholder="Nume" value={editRetState.nume} onChange={e=>setEditRetState({...editRetState, nume:e.target.value})} />
                    <Input type="color" value={editRetState.culoare} onChange={e=>setEditRetState({...editRetState, culoare:e.target.value})} className="!h-[50px] !p-[3px] cursor-pointer" />
                    <div className="flex gap-3 pt-5">
                        <SecondaryButton onClick={closeModal}>Anulează</SecondaryButton>
                        <PrimaryButton onClick={()=>{
                            if(editRetState.nume){
                                let nr = [...reteleMagazine];
                                nr[modal.data.index] = { nume: editRetState.nume, culoare: editRetState.culoare };
                                updateRetele(nr);
                                
                                db.collection('magazine').where('retea', '==', modal.data.oldName).get().then(snap => {
                                    let updates = []; snap.forEach(doc => updates.push({id: doc.id, data: { retea: editRetState.nume, culoare: editRetState.culoare }}));
                                    FirebaseService.batchUpdate('magazine', updates);
                                });
                                closeModal();
                            }
                        }}>Salvează</PrimaryButton>
                    </div>
                </BaseModal>

                <BaseModal isOpen={modal.type === MODAL_TYPES.EXPORT_BACKUP} title="Exportă copie de rezervă">
                    <p className="text-text-main dark:text-white font-medium text-[1rem] mt-0 mb-4">Alege ce vrei să salvezi în fișier.</p>
                    <Select value={selectedBackupScope} onChange={(e) => setExportScope(e.target.value)}>
                        <option value="settings">Setări: rețele, detalii, produse și termene</option>
                        <option value="sectors_stores">Sectoare și magazine</option>
                        <option value="products_lots">Produse + loturi</option>
                    </Select>
                    <div className="flex gap-3 pt-5">
                        <SecondaryButton onClick={closeModal}>Anulează</SecondaryButton>
                        <PrimaryButton onClick={() => { handleExportBackup(selectedBackupScope); closeModal(); }}>Exportă</PrimaryButton>
                    </div>
                </BaseModal>

                <BaseModal isOpen={modal.type === MODAL_TYPES.PRODUCT_IMAGE} title="Imagine Produs / Cod de Bare">
                    {modal.type === MODAL_TYPES.PRODUCT_IMAGE && modal.data && (
                        <ProductImageModalContent 
                            catName={modal.data.catName} 
                            prodName={modal.data.prodName} 
                            closeModal={closeModal} 
                        />
                    )}
                </BaseModal>

                <SearchModal 
                    isOpen={modal.type === MODAL_TYPES.SEARCH} 
                    onClose={closeModal} 
                    dbMagazine={dbMagazine} 
                    dbSectoare={dbSectoare} 
                    setView={setView} 
                />

                <BaseModal isOpen={modal.type === MODAL_TYPES.CONFIRM} title={modal.data?.title}>
                    <p className="text-text-main dark:text-white font-medium text-[1.1rem] mb-5 mt-0">{modal.data?.msg}</p>
                    <div className="flex gap-3">
                        <SecondaryButton onClick={closeModal}>Anulează</SecondaryButton>
                        <DangerButton onClick={()=>{if(modal.data?.onConfirm)modal.data.onConfirm(); closeModal();}}>Șterge</DangerButton>
                    </div>
                </BaseModal>

                <BaseModal isOpen={modal.type === MODAL_TYPES.PROMPT} title={modal.data?.title} key={modal.data?.title + "_" + (modal.data?.val || "")}>
                    <Input placeholder={modal.data?.placeholder} defaultValue={modal.data?.val} id="prompt-input" autoFocus />
                    <div className="flex gap-3 pt-5">
                        <SecondaryButton onClick={closeModal}>Anulează</SecondaryButton>
                        <PrimaryButton onClick={()=>{
                            let val = document.getElementById('prompt-input').value.trim();
                            let shouldClose = true;
                            if(modal.data?.onSave) {
                                shouldClose = modal.data.onSave(val) !== false;
                            }
                            if (shouldClose) closeModal();
                        }}>Salvează</PrimaryButton>
                    </div>
                </BaseModal>

                <BaseModal isOpen={modal.type === MODAL_TYPES.ALERT} title="Atenție!">
                    <p className="text-text-main dark:text-white font-medium text-[1.1rem] mb-5 mt-0 text-center leading-relaxed">{modal.data?.msg}</p>
                    <div className="flex justify-center pt-3">
                        <button 
                            onClick={() => {
                                if(modal.data?.prevType) {
                                    openModal(modal.data.prevType, modal.data.prevData);
                                } else {
                                    closeModal();
                                }
                            }} 
                            className="bg-accent hover:bg-blue-700 text-white font-black rounded-xl p-[10px_35px] shadow-md uppercase text-[0.85rem] transition-colors"
                        >
                            Confirmă
                        </button>
                    </div>
                </BaseModal>
            </React.Fragment>
        );
    };

    // ==========================================
    // 9. REACT DOM RENDER
    // ==========================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppProvider><MainApp /></AppProvider>);
</script>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('Eroare SW:', err));
        });
    }
</script>

</body>
</html>
