    const FirebaseService = {
        add: (collection, data) => db.collection(collection).add({ ...data, timestamp: firebase.firestore.FieldValue.serverTimestamp() }),
        update: (collection, id, data) => db.collection(collection).doc(id).update(data),
        delete: (collection, id) => db.collection(collection).doc(id).delete(),
        batchUpdate: (collection, updates) => {
            const batch = db.batch();
            updates.forEach(u => batch.update(db.collection(collection).doc(u.id), u.data));
            return batch.commit();
        },
        deleteSectorCascading: async (sectorId) => {
            const batch = db.batch();
            batch.delete(db.collection('sectoare').doc(sectorId));
            try {
                const magazineSnap = await db.collection('magazine').where('sectorId', '==', sectorId).get();
                const magIds = [];
                magazineSnap.forEach(doc => {
                    batch.delete(doc.ref);
                    magIds.push(doc.id);
                });
                if (magIds.length > 0) {
                    const productsSnap = await db.collection('produse_magazin').get();
                    const prodIds = [];
                    productsSnap.forEach(doc => {
                        const data = doc.data();
                        if (magIds.includes(data.magazinId)) {
                            batch.delete(doc.ref);
                            prodIds.push(doc.id);
                        }
                    });
                    if (prodIds.length > 0) {
                        const loturiSnap = await db.collection('loturi').get();
                        loturiSnap.forEach(doc => {
                            const data = doc.data();
                            if (prodIds.includes(data.produsId)) {
                                batch.delete(doc.ref);
                            }
                        });
                    }
                }
                await batch.commit();
            } catch (err) {
                console.error("Cascading deletion failed:", err);
                await db.collection('sectoare').doc(sectorId).delete();
            }
        },
        deleteStoreCascading: async (storeId) => {
            const batch = db.batch();
            batch.delete(db.collection('magazine').doc(storeId));
            try {
                const productsSnap = await db.collection('produse_magazin').where('magazinId', '==', storeId).get();
                const prodIds = [];
                productsSnap.forEach(doc => {
                    batch.delete(doc.ref);
                    prodIds.push(doc.id);
                });
                if (prodIds.length > 0) {
                    const loturiSnap = await db.collection('loturi').get();
                    loturiSnap.forEach(doc => {
                        const data = doc.data();
                        if (prodIds.includes(data.produsId)) {
                            batch.delete(doc.ref);
                        }
                    });
                }
                const pozeSnap = await db.collection('poze_magazine').where('magazinId', '==', storeId).get();
                pozeSnap.forEach(doc => {
                    batch.delete(doc.ref);
                });
                await batch.commit();
            } catch (err) {
                console.error("Store cascading deletion failed:", err);
                await db.collection('magazine').doc(storeId).delete();
            }
        },
        deleteProductCascading: async (productId) => {
            const batch = db.batch();
            batch.delete(db.collection('produse_magazin').doc(productId));
            try {
                const loturiSnap = await db.collection('loturi').where('produsId', '==', productId).get();
                loturiSnap.forEach(doc => {
                    batch.delete(doc.ref);
                });
                await batch.commit();
            } catch (err) {
                console.error("Product cascading deletion failed:", err);
                await db.collection('produse_magazin').doc(productId).delete();
            }
        }
    };

    // ==========================================
    // 4. HELPER FUNCTIONS
    // ==========================================
    const Helpers = {
        convertDataToTime: (dateStr) => {
            if(!dateStr || dateStr === "Dată invalidă" || dateStr === "Calculată" || dateStr === "N/A" || typeof dateStr !== "string") return new Date(8640000000000000).getTime();
            let parts = dateStr.trim().split('.'); if(parts.length !== 3) return new Date(8640000000000000).getTime();
            return new Date(parts[2], parts[1] - 1, parts[0]).getTime();
        },
        calculeazaExpirare: (dataProdStr, categorieObj) => {
            if(!/^\d{2}\.\d{2}\.\d{4}$/.test(dataProdStr)) return "Dată invalidă";
            let parts = dataProdStr.split('.');
            let d = parseInt(parts[0], 10), m = parseInt(parts[1], 10), y = parseInt(parts[2], 10);
            if(isNaN(d) || isNaN(m) || isNaN(y)) return "Dată invalidă";
            
            let prodDate = new Date(y, m - 1, d);
            if(!categorieObj) return "Calculată";
            
            let termVal = parseInt(categorieObj.termen) || 0;
            if (categorieObj.unit === 'zile') prodDate.setDate(prodDate.getDate() + termVal);
            else if (categorieObj.unit === 'luni') prodDate.setMonth(prodDate.getMonth() + termVal);
            
            return `${String(prodDate.getDate()).padStart(2, '0')}.${String(prodDate.getMonth() + 1).padStart(2, '0')}.${prodDate.getFullYear()}`;
        },
        sortByOrder: (arr) => {
            return [...arr].sort((a, b) => {
                const orderA = a.order !== undefined ? a.order : (a.timestamp?.toMillis ? a.timestamp.toMillis() : 0);
                const orderB = b.order !== undefined ? b.order : (b.timestamp?.toMillis ? b.timestamp.toMillis() : 0);
                return orderA - orderB;
            });
        },
        initSortable: (container, dataRef, collectionName) => {
            let originalNextSibling = null;
            return new Sortable(container, {
                animation: 150, delay: 200, delayOnTouchOnly: true, touchStartThreshold: 5, ghostClass: 'sortable-ghost',
                onStart: (evt) => {
                    originalNextSibling = evt.item.nextSibling;
                },
                onEnd: (evt) => {
                    if (evt.oldIndex !== undefined && evt.newIndex !== undefined && evt.oldIndex !== evt.newIndex) {
                        // Revert standard DOM change so React can handle the rendering correctly
                        if (originalNextSibling) {
                            evt.from.insertBefore(evt.item, originalNextSibling);
                        } else {
                            evt.from.appendChild(evt.item);
                        }

                        const newOrder = [...dataRef.current];
                        const moved = newOrder.splice(evt.oldIndex, 1)[0];
                        newOrder.splice(evt.newIndex, 0, moved);
                        const updates = newOrder.map((item, idx) => ({ id: item.id, data: { order: idx } }));
                        FirebaseService.batchUpdate(collectionName, updates);
                    }
                }
            });
        }
    };

    // ==========================================

    const AppContext = createContext();

    const AppProvider = ({ children }) => {

        const [dbSectoare, setDbSectoare] = useState({});
        const [dbMagazine, setDbMagazine] = useState({});
        const [dbProduse, setDbProduse] = useState({});
        const [dbLoturi, setDbLoturi] = useState({});

        // Setări Globale cu stocare în Firestore ca sursă unică a adevărului (pentru sincronizare multi-device)
        const [catalogCategorii, setCatalogCategorii] = useState(CONFIG.DEFAULT_CATALOG);
        const [reteleMagazine, setReteleMagazine] = useState(CONFIG.DEFAULT_RETELE);
        const [proprietatiMagazine, setProprietatiMagazine] = useState(CONFIG.DEFAULT_PROPS);
        const [googleSpreadsheetId, setGoogleSpreadsheetId] = useState('');
        const [googleSheetName, setGoogleSheetName] = useState('Sheet1');
        const [gUser, setGUser] = useState(null);
        const [gToken, setGToken] = useState(null);

        // Încarcă din localStorage tokenul temporar dacă există pentru o experiență mai fluidă
        useEffect(() => {
            const savedToken = localStorage.getItem('g_access_token');
            if (savedToken) {
                setGToken(savedToken);
            }
            const unsubAuth = firebase.auth().onAuthStateChanged(user => {
                setGUser(user);

            return () => unsubAuth();
        }, []);

    const gSignIn = async () => {
    try {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.addScope('https://www.googleapis.com/auth/spreadsheets');
        provider.setCustomParameters({ prompt: 'consent' });

        // În loc de popup, redirecționăm pagina. Este mult mai sigur și nu se blochează!
        await firebase.auth().signInWithRedirect(provider);
    } catch (err) {

        alert("Eroare la conectare: " + err.message);
    }
};
        // Această funcție trebuie să ruleze când se încarcă pagina
const checkRedirectResult = async () => {

        const result = await firebase.auth().getRedirectResult();
        if (result && result.credential) {

};

// APELEAZĂ ASTA LA ÎNCĂRCAREA PAGINII (dacă folosești React useEffect sau un script care pornește la onload)
// checkRedirectResult();
        const gSignOut = async () => {

        // Firebase Realtime Sync pentru Date Aplicație & Setări Globale
        useEffect(() => {

            const u1 = db.collection('sectoare').onSnapshot(s => { let obj={}; s.forEach(d => obj[d.id] = {id: d.id, ...d.data()}); setDbSectoare(obj); checkReady(); }, err => console.error(err));

            const u4 = db.collection('loturi').onSnapshot(s => { let obj={}; s.forEach(d => obj[d.id] = {id: d.id, ...d.data()}); setDbLoturi(obj); checkReady(); }, err => console.error(err));
            
            // Ascultăm în timp real documentul global de setări din Firestore pentru sincronizare universală (mobil <-> desktop)
            const u5 = db.collection('setari').doc('config_global').onSnapshot(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.catalogCategorii) {
                        setCatalogCategorii(prev => JSON.stringify(prev) === JSON.stringify(data.catalogCategorii) ? prev : data.catalogCategorii);
                    }
                    if (data.reteleMagazine) {
                        setReteleMagazine(prev => JSON.stringify(prev) === JSON.stringify(data.reteleMagazine) ? prev : data.reteleMagazine);
                    }
                    if (data.proprietatiMagazine) {
                        setProprietatiMagazine(prev => JSON.stringify(prev) === JSON.stringify(data.proprietatiMagazine) ? prev : data.proprietatiMagazine);
                    }
                    if (data.googleSpreadsheetId !== undefined) {
                        setGoogleSpreadsheetId(data.googleSpreadsheetId);
                    }
                    if (data.googleSheetName !== undefined) {
                        setGoogleSheetName(data.googleSheetName);
                    }
                } else {
                    // Dacă e prima dată când pornește pe acel Firestore, inițializăm documentul cu CONFIG
                    db.collection('setari').doc('config_global').set({
                        catalogCategorii: CONFIG.DEFAULT_CATALOG,
                        reteleMagazine: CONFIG.DEFAULT_RETELE,
                        proprietatiMagazine: CONFIG.DEFAULT_PROPS
                    }).catch(err => console.error("Initial config setup failed", err));
                }
                checkReady();
            }, err => {
                console.error("Settings listener error, fallback to defaults/localStorage:", err);
                checkReady();
            });

            return () => { u1(); u2(); u3(); u4(); u5(); };
        }, []);

        // History API (Swipe Back logic)
        const uiDepthRef = useRef(0);
        const popLockRef = useRef(false);

        const closeTopLayer = () => {
            if (modal.type) { closeModal(); return true; }
            if (view.page === PAGES.PRODUCT) { setView({page: PAGES.STORE, data: view.data.backData}); return true; }
            if (view.page === PAGES.STORE) { setView({page: PAGES.SECTOR, data: view.data.sector}); return true; }
            if (view.page === PAGES.SECTOR || view.page === PAGES.SETTINGS) { setView({page: PAGES.MAIN, data: null}); return true; }
            return false;
        };

        const getUiDepth = () => {
            let d = 0;
            if (view.page === PAGES.SECTOR || view.page === PAGES.SETTINGS) d = 1;
            if (view.page === PAGES.STORE) d = 2;
            if (view.page === PAGES.PRODUCT) d = 3;
            if (modal.type) d++;
            return d;
        };

        useEffect(() => { history.replaceState({ appDepth: 0 }, document.title); }, []);

        useEffect(() => {
            const depth = getUiDepth();
            if (popLockRef.current) { uiDepthRef.current = depth; popLockRef.current = false; return; }
            if (depth > uiDepthRef.current) { history.pushState({ appDepth: depth }, document.title); }
            uiDepthRef.current = depth;
        }, [view, modal]);

        useEffect(() => {
            const onPopState = () => { popLockRef.current = true; closeTopLayer(); };
            window.addEventListener('popstate', onPopState);
            return () => window.removeEventListener('popstate', onPopState);
        }, [view, modal]);

        const contextValue = {
            isReady, view, setView, theme, setTheme, modal, openModal, closeModal, confirmAction, promptAction,
            dbSectoare, dbMagazine, dbProduse, dbLoturi,
            catalogCategorii, updateCatalog, reteleMagazine, updateRetele, proprietatiMagazine, updateProp, expConfigs, updateExpConfig,
            googleSpreadsheetId, updateGoogleSpreadsheetId, googleSheetName, updateGoogleSheetName,
            gUser, gToken, gSignIn, gSignOut
        };

        return <AppContext.Provider value={contextValue}>{children}</AppContext.Provider>;
    };

    // --- Componentă Expirări Reutilizabilă ---
    const ExpirariBox = ({ type, data }) => {
        const { dbSectoare, dbMagazine, dbProduse, dbLoturi, expConfigs, updateExpConfig, setView, catalogCategorii } = useApp();
        const config = expConfigs[type];
        const [val, setVal] = useState(config.val === 0 ? '' : config.val);
        const [unit, setUnit] = useState(config.unit);

        const handleConfigChange = (newValStr, newUnit) => { 
            setVal(newValStr); setUnit(newUnit); 
            let parsedVal = Math.max(0, parseInt(newValStr) || 0);
            updateExpConfig(type, parsedVal, newUnit); 
        };

        const zileMaxime = useMemo(() => {
            let v = parseInt(val) || 0;
            if(unit === 'saptamani') return v * 7; if(unit === 'luni') return v * 30; return v;
        }, [val, unit]);

        const items = useMemo(() => {
            let arr = []; let msAzi = new Date().setHours(0,0,0,0);
            for(let lotId in dbLoturi) {
                let lot = dbLoturi[lotId]; 
                let prod = dbProduse[lot.produsId]; if(!prod) continue;
                let mag = dbMagazine[prod.magazinId]; if(!mag) continue;
                let sec = dbSectoare[mag.sectorId]; if(!sec) continue;

                let isDrojdii = prod.categorie === 'Drojdii';
                let lotDataExp = lot.dataExp;
                if (!isDrojdii && lot.dataProd && lot.dataProd !== "N/A") {
                    let catObj = catalogCategorii[prod.categorie];
                    let expCalc = Helpers.calculeazaExpirare(lot.dataProd, catObj);
                    if (expCalc !== "Dată invalidă") {
                        lotDataExp = expCalc;
                    }
                }

                let expTime = Helpers.convertDataToTime(lotDataExp);
                if(expTime > 8000000000000000) continue; 
                let zileRamase = Math.round((expTime - msAzi) / (1000 * 3600 * 24));

                if (zileRamase <= zileMaxime) {
                    if (type === 'global' || (type === 'sector' && data?.currentSectorId === sec.id) || (type === 'store' && data?.currentStoreId === mag.id)) {
                        arr.push({ lot: { ...lot, dataExp: lotDataExp }, prod, mag, sec, zile: zileRamase });
                    }
                }
            }
            return arr.sort((a, b) => a.zile - b.zile);
        }, [dbSectoare, dbMagazine, dbProduse, dbLoturi, zileMaxime, type, data, catalogCategorii]);

        return (
            <Card className="!border-[1.5px] !border-danger !shadow-lg">
                <div className="flex justify-between items-center font-bold text-[1.1rem] text-danger flex-wrap gap-2 border-b border-danger/20 pb-3">
                    <span className="flex items-center gap-2"><i className="fas fa-exclamation-circle text-xl"></i> Expiră în curând</span>
                    <div className="flex gap-2 items-center bg-transparent border border-border-color dark:border-dark-border p-1.5 rounded-xl">
                        <input type="number" min="0" placeholder="0" value={val} onChange={e => setVal(e.target.value)} onBlur={() => handleConfigChange(val, unit)} className="w-[45px] bg-transparent text-center font-bold outline-none text-text-main dark:text-dark-text-main" />
                        <select value={unit} onChange={e => handleConfigChange(val, e.target.value)} className="bg-transparent dark:bg-dark-surface font-bold outline-none cursor-pointer text-text-main dark:text-white">
                            <option value="zile" className="dark:bg-dark-surface dark:text-white">Zile</option>
                            <option value="saptamani" className="dark:bg-dark-surface dark:text-white">Săpt.</option>
                            <option value="luni" className="dark:bg-dark-surface dark:text-white">Luni</option>
                        </select>
                    </div>
                </div>
                <div className="pt-2">
                    {items.length === 0 ? (
                        <div className="p-4 text-center text-text-sec font-medium">Toate produsele sunt în termen.</div>
                    ) : items.map((item, idx) => (
                        <div key={idx} className="border-b border-border-color dark:border-dark-border py-4 flex justify-between items-start last:border-0">
                            <div className="flex-1 pr-2">
                                <div className="mb-2 cursor-pointer font-black text-[1.05rem]" onClick={() => setView({page: PAGES.PRODUCT, data: { id: item.prod.id, nume: item.prod.nume, categorie: item.prod.categorie, magazinCuloare: item.mag.culoare, magazinNume: item.mag.nume, magazinAdresa: item.mag.adresa, backData: {magazin: item.mag, sector: item.sec} }})}>
                                    {item.prod.nume} <span className="text-text-sec font-medium text-[0.9rem]">({item.lot.cantitate} buc)</span>
                                </div>
                                <div className="text-[0.9rem] mb-3 font-medium">
                                    {item.zile < 0 ? (
                                        <span className="text-text-main dark:text-white">
                                            A expirat de <span className="text-danger font-black">{Math.abs(item.zile)} zile</span>
                                        </span>
                                    ) : item.zile === 0 ? (
                                        <span className="text-danger font-black animate-pulse">Expiră ASTĂZI</span>
                                    ) : (
                                        <span className="text-text-main dark:text-white">
                                            Va expira în <span className="text-danger font-black">{item.zile} zile</span>
                                        </span>
                                    )}
                                </div>
                                {(type === 'global' || type === 'sector') && (
                                    <div className="flex flex-wrap gap-2 mt-2">
                                        {type === 'global' && (
                                            <span onClick={() => setView({page: PAGES.SECTOR, data: item.sec})} className="inline-flex items-center gap-1.5 px-3 py-1 bg-surface-color dark:bg-dark-surface text-text-main dark:text-dark-text-main rounded-xl text-[0.75rem] font-bold cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-800 shadow-sm border border-border-color/50 dark:border-dark-border/50">
                                                <i className="fas fa-map" style={{color: item.sec.culoare}}></i> {item.sec.nume}
                                            </span>
                                        )}
                                        <span onClick={() => setView({page: PAGES.STORE, data: {magazin: item.mag, sector: item.sec}})} className="inline-flex items-center gap-1.5 px-3 py-1 bg-surface-color dark:bg-dark-surface text-text-main dark:text-dark-text-main rounded-xl text-[0.75rem] font-bold cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-800 shadow-sm border border-border-color/50 dark:border-dark-border/50">
                                            <i className="fas fa-store" style={{color: item.mag.culoare}}></i> {item.mag.nume}
                                        </span>
                                    </div>
                                )}
                            </div>
                            <div className="text-danger text-[1.1rem] font-black self-center">
                                {item.lot.dataExp}
                            </div>
                        </div>
                    ))}
                </div>
            </Card>
        );
    };

    const ProductImageModalContent = ({ catName, prodName, closeModal }) => {
        const [imageUrl, setImageUrl] = useState('');
        const [loading, setLoading] = useState(true);
        const [saving, setSaving] = useState(false);
        const [dragActive, setDragActive] = useState(false);
        const docId = `${catName}___${prodName}`;

        useEffect(() => {
            const unsubscribe = db.collection('imagini_produse').doc(docId).onSnapshot(doc => {
                if (doc.exists) {
                    setImageUrl(doc.data().image || '');
                } else {
                    setImageUrl('');
                }
                setLoading(false);
            }, err => {
                console.error("Eroare la citirea imaginii produsului:", err);
                setLoading(false);
            });
            return () => unsubscribe();
        }, [docId]);

        const handleFileSelect = (file) => {
            if (!file) return;
            setSaving(true);
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const MAX_SIZE = 800; // Calitate excelentă a imaginii, dar redimensionată sub limita de 1MB a documentului Firestore
                    if (width > height) {
                        if (width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        }
                    } else {
                        if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);

                    db.collection('imagini_produse').doc(docId).set({
                        image: compressedDataUrl,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true })
                    .then(() => {
                        setSaving(false);
                    })
                    .catch(err => {
                        console.error("Eroare salvare image:", err);
                        setSaving(false);
                        alert("Eroare salvare: " + err.message);
                    });
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        const handleDrag = (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (e.type === "dragenter" || e.type === "dragover") {
                setDragActive(true);
            } else if (e.type === "dragleave") {
                setDragActive(false);
            }
        };

        const handleDrop = (e) => {
            e.preventDefault();
            e.stopPropagation();
            setDragActive(false);
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                handleFileSelect(e.dataTransfer.files[0]);
            }
        };

        const deleteImage = () => {
            if (confirm("Sigur dorești să ștergi imaginea asociată acestui produs?")) {
                setSaving(true);
                db.collection('imagini_produse').doc(docId).delete()
                    .then(() => {
                        setImageUrl('');
                        setSaving(false);
                    })
                    .catch(e => {
                        console.error(e);
                        setSaving(false);
                    });
            }
        };

        return (
            <div className="p-1">
                <div className="mb-4 text-center">
                    <span className="block text-[0.8rem] font-bold text-text-sec uppercase tracking-wider">{catName}</span>
                    <h3 className="text-[1.25rem] font-black text-text-main dark:text-white mt-1">{prodName}</h3>
                </div>

                {loading ? (
                    <div className="flex flex-col items-center justify-center py-10">
                        <i className="fas fa-spinner animate-spin text-accent text-[2.2rem] mb-3"></i>
                        <span className="text-text-sec font-medium text-[0.85rem]">Se încarcă imaginea...</span>
                    </div>
                ) : imageUrl ? (
                    <div className="flex flex-col items-center gap-4">
                        <div className="relative w-full max-h-[300px] overflow-hidden rounded-xl border border-border-color dark:border-dark-border bg-gray-50 dark:bg-gray-900/20 flex items-center justify-center p-2">
                            <img src={imageUrl} alt={prodName} className="max-w-full max-h-[280px] object-contain rounded-lg shadow-sm" />
                            {saving && (
                                <div className="absolute inset-0 bg-white/70 dark:bg-black/70 flex items-center justify-center rounded-xl">
                                    <i className="fas fa-spinner animate-spin text-accent text-[1.8rem]"></i>
                                </div>
                            )}
                        </div>
                        
                        <div className="flex gap-2.5 w-full">
                            <button 
                                onClick={() => document.getElementById('prod_img_file').click()}
                                className="flex-1 bg-blue-50 dark:bg-blue-900/30 text-accent font-bold rounded-xl p-3 text-[0.85rem] uppercase cursor-pointer hover:bg-blue-100 dark:hover:bg-blue-900/55 transition-colors flex justify-center items-center gap-1.5"
                            >
                                <i className="fas fa-sync-alt"></i> Schimbă imaginea
                            </button>
                            <button 
                                onClick={deleteImage}
                                className="bg-red-50 dark:bg-red-900/25 text-danger font-bold rounded-xl p-3 text-[0.85rem] uppercase cursor-pointer hover:bg-red-100 transition-colors flex justify-center items-center px-4"
                                title="Șterge imagine"
                            >
                                <i className="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                ) : (
                    <div 
                        onDragEnter={handleDrag} 
                        onDragOver={handleDrag} 
                        onDragLeave={handleDrag} 
                        onDrop={handleDrop}
                        onClick={() => document.getElementById('prod_img_file').click()}
                        className={`border-2 border-dashed rounded-xl p-6 text-center cursor-pointer transition-all flex flex-col items-center justify-center min-h-[180px] ${
                            dragActive 
                            ? 'border-accent bg-blue-50/50 dark:bg-blue-900/20 scale-[0.98]' 
                            : 'border-border-color dark:border-dark-border hover:border-accent hover:bg-gray-50 dark:hover:bg-gray-900/10'
                        }`}
                    >
                        {saving ? (
                            <React.Fragment>
                                <i className="fas fa-spinner animate-spin text-accent text-[2.2rem] mb-3"></i>
                                <span className="font-bold text-[0.95rem] text-text-main dark:text-white">Se salvează...</span>
                            </React.Fragment>
                        ) : (
                            <React.Fragment>
                                <div className="w-14 h-14 rounded-full bg-blue-50 dark:bg-blue-900/20 flex items-center justify-center text-accent mb-3.5">
                                    <i className="fas fa-camera text-[1.4rem]"></i>
                                </div>
                                <span className="font-black text-[0.9rem] text-text-main dark:text-white">Fă o poză sau alege un fișier</span>
                                <span className="text-[0.8rem] text-text-sec mt-1.5 font-medium leading-relaxed max-w-[220px]">
                                    Ideal pentru fotografierea codului de bare al produsului
                                </span>
                            </React.Fragment>
                        )}
                    </div>
                )}
                <input 
                    type="file" 
                    id="prod_img_file" 
                    accept="image/*" 
                    className="hidden" 
                    onChange={e => {
                        if (e.target.files && e.target.files[0]) {
                            handleFileSelect(e.target.files[0]);
                        }
                    }} 
                />
                
                <div className="flex justify-end gap-3 pt-5 border-t border-dashed border-border-color dark:border-dark-border mt-4">
                    <button

                        className="p-3 font-black text-text-sec uppercase text-[0.8rem] bg-gray-100 dark:bg-gray-800 rounded-xl hover:opacity-80 transition-colors w-full"
                    >
                        Închide
                    </button>
                </div>
            </div>
        );

                                                    });
                                                    return false;
                                                }
                                                let np = [...proprietatiMagazine];
                                                np[i] = newName;
                                                updateProp(np);
                                                
                                                // Modificăm cheia din documentele magazinelor din Firestore pentru păstrarea datelor introduse anterior
                                                db.collection('magazine').get().then(snap => {
                                                    let batch = db.batch();
                                                    let modified = false;
                                                    snap.forEach(doc => {
                                                        let data = doc.data();
                                                        if(data.proprietati && data.proprietati[p] !== undefined) {
                                                            let props = { ...data.proprietati };
                                                            props[newName] = props[p];
                                                            delete props[p];
                                                            batch.update(doc.ref, { proprietati: props });
                                                            modified = true;
                                                        }
                                                    });
                                                    if(modified) batch.commit();
                                                }).catch(err => console.error("Properties shift error:", err));
                                            }
                                        };
                                        promptAction("Schimbă Nume Câmp", p, "Ex: Telefon", onRenameProp);
                                    }} />

    const StorePhotosSection = ({ magazinId, confirmAction }) => {
        const [photos, setPhotos] = useState([]);
        const [loading, setLoading] = useState(true);
        const [uploading, setUploading] = useState(false);
        const [selectedPhoto, setSelectedPhoto] = useState(null);

        useEffect(() => {
            setLoading(true);
            const unsubscribe = db.collection('poze_magazine')
                .where('magazinId', '==', magazinId)
                .onSnapshot(snapshot => {
                    const list = [];
                    snapshot.forEach(doc => {
                        list.push({ id: doc.id, ...doc.data() });
                    });
                    // Sortare locală pentru a evita eroarea de index compus în Firestore
                    list.sort((a, b) => {
                        const tA = a.timestamp?.toMillis ? a.timestamp.toMillis() : (a.timestamp || 0);
                        const tB = b.timestamp?.toMillis ? b.timestamp.toMillis() : (b.timestamp || 0);
                        return tB - tA;
                    });
                    setPhotos(list);
                    setLoading(false);
                }, err => {
                    console.error("Eroare incarcare poze magazin:", err);
                    setLoading(false);
                });
            return () => unsubscribe();
        }, [magazinId]);

        const handleFileSelect = (file) => {
            if (!file) return;
            setUploading(true);
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const MAX_SIZE = 700; // Redimensionare optimă pentru stocare eficientă în Firestore
                    if (width > height) {
                        if (width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        }
                    } else {
                        if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.82); // Compresie excelentă (~35-65 KB)

                    db.collection('poze_magazine').add({
                        magazinId,
                        image: compressedDataUrl,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    })
                    .then(() => {
                        setUploading(false);
                    })
                    .catch(err => {
                        console.error("Eroare salvare poza magazin:", err);
                        setUploading(false);
                        alert("Eroare salvare poză: " + err.message);
                    });
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        const handleDeletePhoto = (photoId, e) => {
            if (e) e.stopPropagation();
            confirmAction("Șterge Poză", "Sigur dorești să ștergi această poză din magazin?", () => {
                db.collection('poze_magazine').doc(photoId).delete()
                    .catch(err => console.error("Eroare stergere poza magazin:", err));
            });
        };

        return (
            <Card className="!p-4 border border-border-color dark:border-dark-border shadow-sm">
                <div className="flex justify-between items-center font-black text-[1.2rem] mb-2">
                    <span className="flex items-center gap-2">
                        <i className="fas fa-images text-accent animate-pulse-fast"></i>
                        Poze magazin / depozit
                    </span>
                    <span className="text-[0.75rem] font-bold text-text-sec bg-blue-50 dark:bg-blue-950/20 p-1.5 rounded-lg border border-blue-100 dark:border-blue-900/30">
                        {photos.length} {photos.length === 1 ? 'poză' : 'poze'}
                    </span>
                </div>

                {loading ? (
                    <div className="flex justify-center items-center py-6">
                        <i className="fas fa-spinner animate-spin text-accent text-[1.5rem]"></i>
                    </div>
                ) : (
                    <div className="grid grid-cols-3 gap-2.5 mt-3">
                        {photos.map(p => (
                            <div 
                                key={p.id} 
                                className="relative aspect-square rounded-xl overflow-hidden bg-gray-50 dark:bg-gray-900 border border-border-color dark:border-dark-border group cursor-pointer hover:opacity-90 active:scale-95 transition-all"
                                onClick={() => setSelectedPhoto(p)}
                            >
                                <img src={p.image} alt="Magazin" className="w-full h-full object-cover rounded-xl" />
                                <button 
                                    onClick={(e) => handleDeletePhoto(p.id, e)}
                                    className="absolute top-1 right-1 w-6 h-6 rounded-full bg-red-500 text-white flex items-center justify-center text-[0.7rem] hover:scale-110 active:scale-95 transition-transform shadow-lg border border-white/20"
                                    title="Șterge poză"
                                >
                                    <i className="fas fa-trash-can"></i>
                                </button>
                            </div>
                        ))}

                        {/* Buton adaugă poză */}
                        <div 
                            onClick={() => document.getElementById('store_photo_file_input').click()}
                            className={`aspect-square rounded-xl border-2 border-dashed flex flex-col items-center justify-center p-2 cursor-pointer transition-all ${
                                uploading 
                                ? 'border-accent bg-blue-50/50 dark:bg-blue-900/10' 
                                : 'border-border-color dark:border-dark-border hover:border-accent hover:bg-gray-50 dark:hover:bg-gray-900/10 active:scale-95'
                            }`}
                        >
                            {uploading ? (
                                <React.Fragment>
                                    <i className="fas fa-spinner animate-spin text-accent text-[1.5rem] mb-1"></i>
                                    <span className="text-[0.65rem] font-black text-accent text-center leading-tight">Încărcare...</span>
                                </React.Fragment>
                            ) : (
                                <React.Fragment>
                                    <i className="fas fa-camera text-accent text-[1.4rem] mb-1"></i>
                                    <span className="text-[0.7rem] font-bold text-text-main dark:text-white text-center leading-tight">Adaugă Poză</span>
                                </React.Fragment>
                            )}
                        </div>
                    </div>
                )}

                <input 
                    type="file" 
                    id="store_photo_file_input" 
                    accept="image/*" 
                    className="hidden" 
                    onChange={e => {
                        if (e.target.files && e.target.files[0]) {
                            handleFileSelect(e.target.files[0]);
                        }
                    }} 
                />

                {/* Lightbox / Modal de vizualizare completă a pozei */}
                {selectedPhoto && (
                    <div 
                        className="fixed inset-0 bg-black/95 z-[1100] flex flex-col justify-between p-4 animate-fade-in backdrop-blur-sm"
                        onClick={() => setSelectedPhoto(null)}
                    >
                        <div className="flex justify-between items-center w-full pt-2">
                            <span className="text-white font-black text-[0.95rem] bg-gray-900/80 p-2 px-3 rounded-xl border border-white/10">
                                Detalii Foto Magazin
                            </span>
                            <button 
                                className="w-10 h-10 rounded-full bg-white/10 text-white flex items-center justify-center hover:bg-white/20 transition-colors"
                                onClick={() => setSelectedPhoto(null)}
                            >
                                <i className="fas fa-times text-lg"></i>
                            </button>
                        </div>

                        <div className="flex-1 flex items-center justify-center p-2 max-h-[85vh]">
                            <img 
                                src={selectedPhoto.image} 
                                alt="Vizualizare completă" 
                                className="max-w-[100vw] max-h-[75vh] object-contain rounded-xl shadow-2xl border border-white/15"
                                onClick={(e) => e.stopPropagation()} 
                            />
                        </div>

                        <div className="flex gap-3 justify-center pb-4 pt-2">
                            <button 
                                onClick={(e) => {
                                    e.stopPropagation();
                                    const idToDelete = selectedPhoto.id;
                                    setSelectedPhoto(null);
                                    handleDeletePhoto(idToDelete);
                                }}
                                className="bg-red-600 hover:bg-red-700 text-white font-black rounded-xl p-3.5 text-[0.85rem] uppercase cursor-pointer transition-colors flex items-center gap-2 px-6 shadow-xl"
                            >
                                <i className="fas fa-trash"></i> Șterge această poză
                            </button>
                        </div>
                    </div>
                )}
            </Card>
        );
    };

    const StorePage = () => {

        return (

                    <React.Fragment>

    // --- Sub-componentă curată pentru Rândurile de Loturi ---
    const LotRow = ({ l, isDrojdii, catObj, confirmAction, onUpdate }) => {
        const [cantitate, setCantitate] = useState(l.cantitate === 0 ? '' : l.cantitate);
        const [dataExp, setDataExp] = useState(l.dataExp || '');
        const [dataProd, setDataProd] = useState(l.dataProd || '');

        useEffect(() => { setCantitate(l.cantitate === 0 ? '' : l.cantitate); }, [l.cantitate]);
        useEffect(() => { setDataExp(l.dataExp || ''); }, [l.dataExp]);
        useEffect(() => { setDataProd(l.dataProd || ''); }, [l.dataProd]);

        const handleQtyBlur = () => {
            let val = parseInt(cantitate);
            if (isNaN(val) || val < 0) val = 0;
            setCantitate(val === 0 ? '' : val);
            if (val !== l.cantitate) {
                FirebaseService.update('loturi', l.id, { cantitate: val });
                onUpdate();
            }
        };

        const handleExpBlur = () => {
            if (!/^\d{2}\.\d{2}\.\d{4}$/.test(dataExp)) {
                alert("Format invalid! Introduceți ZZ.LL.AAAA (ex: 15.08.2025)");
                setDataExp(l.dataExp);
                return;
            }
            if (dataExp !== l.dataExp) {
                FirebaseService.update('loturi', l.id, { dataExp });
                onUpdate();
            }
        };

        const handleProdBlur = () => {
            if (!/^\d{2}\.\d{2}\.\d{4}$/.test(dataProd)) {
                alert("Format invalid! Introduceți ZZ.LL.AAAA (ex: 15.08.2025)");
                setDataProd(l.dataProd);
                return;
            }
            if (dataProd !== l.dataProd) {
                let expCalc = Helpers.calculeazaExpirare(dataProd, catObj);
                if (expCalc !== "Dată invalidă") {
                    FirebaseService.update('loturi', l.id, { dataProd, dataExp: expCalc });
                    onUpdate();
                } else {
                    alert("Dată invalidă calculată!");
                    setDataProd(l.dataProd);
                }
            }

        return (
            <div className="flex justify-between items-center bg-bg-color dark:bg-dark-bg p-2.5 rounded-xl mt-3 border border-border-color dark:border-dark-border shadow-sm">
                <div className="flex flex-col items-center">
                    <span className="text-[0.7rem] font-bold text-text-sec uppercase">Buc</span>
                    <input type="number" min="0" placeholder="0" value={cantitate} onChange={e => setCantitate(e.target.value)} onBlur={handleQtyBlur} className="w-[50px] text-center p-1 mt-1 font-black text-[1.05rem] border border-border-color dark:border-dark-border rounded-lg bg-surface-color dark:bg-dark-surface text-text-main dark:text-white outline-none focus:border-accent" />
                </div>

                    ) : (
                        <strong className="text-danger font-black text-[1rem] mt-2 tracking-tighter">{dataExp}</strong>
                    )}
