<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no border-box">
    <title>LIADA - Mercantizare (Arhitectură Pro)</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'bg-color': '#f2f2f7', 'surface-color': '#ffffff', 'text-main': '#1c1c1e', 'text-sec': '#8e8e93',
                        'accent': '#2563eb', 'danger': '#ef4444', 'border-color': '#c6c6c8',
                        'dark-bg': '#000000', 'dark-surface': '#1c1c1e', 'dark-text-main': '#ffffff',
                        'dark-text-sec': '#ebebf5', 'dark-border': '#38383a'
                    },
                    animation: { 'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite', 'fade-in': 'fadeIn 0.2s ease-in-out', 'scale-in': 'scaleIn 0.2s ease-out' },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        scaleIn: { '0%': { opacity: '0', transform: 'scale(0.95)' }, '100%': { opacity: '1', transform: 'scale(1)' } }
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 8px; }
        .sortable-ghost { opacity: 0.4; transform: scale(0.98); }
    </style>
</head>
<body class="bg-bg-color dark:bg-dark-bg text-text-main dark:text-dark-text-main transition-colors duration-300 m-0">

<div id="root" class="max-w-[600px] mx-auto min-h-screen relative shadow-2xl bg-bg-color dark:bg-dark-bg"></div>

<script type="text/babel">
    const { useState, useEffect, useMemo, useRef, createContext, useContext } = React;

    // ==========================================
    // 2. FIREBASE CONFIG & LAYER
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyB7O1CAvbXloK379wXKwDY1SObgox7jf3U", authDomain: "liada-f7c95.firebaseapp.com",
        projectId: "liada-f7c95", storageBucket: "liada-f7c95.firebasestorage.app",
        messagingSenderId: "232514890985", appId: "1:232514890985:web:b6914e6b79682a90ca9478"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();
    db.enablePersistence().catch(err => console.warn("Offline DB Error:", err));

    const FirebaseService = {
        add: (collection, data) => db.collection(collection).add({ ...data, timestamp: firebase.firestore.FieldValue.serverTimestamp() }),
        update: (collection, id, data) => db.collection(collection).doc(id).update(data),
        delete: (collection, id) => db.collection(collection).doc(id).delete(),
        batchUpdate: (collection, updates) => {
            const batch = db.batch();
            updates.forEach(u => batch.update(db.collection(collection).doc(u.id), u.data));
            return batch.commit();
        }
    };

    // ==========================================
    // 3. CONSTANTE (CONFIG & MAGIC STRINGS)
    // ==========================================
    const PAGES = { MAIN: 'main', SETTINGS: 'settings', SECTOR: 'sector', STORE: 'store', PRODUCT: 'product' };
    
    const MODAL_TYPES = {
        CONFIRM: 'confirm', PROMPT: 'prompt',
        ADD_SECTOR: 'add_sector', EDIT_SECTOR: 'edit_sector',
        ADD_STORE: 'add_store', EDIT_STORE: 'edit_store',
        ADD_PRODUCT: 'add_product', ADD_LOT: 'add_lot',
        ADD_RET: 'add_ret', EDIT_RET: 'edit_ret', ADD_PROP: 'add_prop'
    };

    const CONFIG = {
        COLORS: { LIADA_HEADER: '#ff3b30', SETTINGS_HEADER: '#333333', DEFAULT_SECTOR: '#007aff', DEFAULT_STORE: '#4CAF50' },
        DEFAULT_CATALOG: {
            "Maioneză - pachete": { termen: 180, unit: "zile", produse: ["🟢 De Casă 185g", "🟡 Provensal 185g", "🟢 De Casă 370g", "🟡 Provensal 370g", "🟢 De Casă 600g", "🟡 Provensal 600g", "🔴 De Elită 450g", "🔴 De Elită 650g", "🟤 Profi 370g"] },
            "Maioneze - căldări": { termen: 120, unit: "zile", produse: ["🔵 Delicios 850ml", "🟢 De Casă 850ml", "🟡 Provensal 850ml", "🟢 De Casă 1.4l", "🟡 Provensal 1.4l", "🟡 Provensal 630g"] },
            "Ketchup": { termen: 180, unit: "zile", produse: ["⚫ Chili 275g", "🟢 Frigărui 275g"] },
            "Paste de tomat": { termen: 180, unit: "zile", produse: ["🔵 Tomate 70g", "🔵 Tomate 275g"] },
            "Muștar": { termen: 120, unit: "zile", produse: ["🟡 Rusesc 200g"] },
            "Oțet": { termen: 12, unit: "luni", produse: ["🟤 Acid Acetic de Mere 5%", "🟢 Acid Acetic 6%", "🟡 Acid Acetic 9%"] },
            "Drojdii": { termen: 0, unit: "zile", produse: ["🟡 Secretul Bunicii 50g"] }
        },
        DEFAULT_RETELE: [{ nume: 'Local', culoare: '#4CAF50' }, { nume: 'Linella', culoare: '#E53935' }],
        DEFAULT_PROPS: ['Manager']
    };

    // ==========================================
    // 4. HELPER FUNCTIONS
    // ==========================================
    const Helpers = {
        convertDataToTime: (dateStr) => {
            if(!dateStr || dateStr === "Dată invalidă" || dateStr === "Calculată" || dateStr === "N/A") return new Date(8640000000000000).getTime();
            let parts = dateStr.split('.'); if(parts.length !== 3) return new Date(8640000000000000).getTime();
            return new Date(parts[2], parts[1] - 1, parts[0]).getTime();
        },
        calculeazaExpirare: (dataProdStr, categorieObj) => {
            if(!/^\d{2}\.\d{2}\.\d{4}$/.test(dataProdStr)) return "Dată invalidă";
            let parts = dataProdStr.split('.');
            let d = parseInt(parts[0], 10), m = parseInt(parts[1], 10), y = parseInt(parts[2], 10);
            if(isNaN(d) || isNaN(m) || isNaN(y)) return "Dată invalidă";
            
            let prodDate = new Date(y, m - 1, d);
            if(!categorieObj) return "Calculată";
            
            let termVal = parseInt(categorieObj.termen) || 0;
            if (categorieObj.unit === 'zile') prodDate.setDate(prodDate.getDate() + termVal);
            else if (categorieObj.unit === 'luni') prodDate.setMonth(prodDate.getMonth() + termVal);
            
            return `${String(prodDate.getDate()).padStart(2, '0')}.${String(prodDate.getMonth() + 1).padStart(2, '0')}.${prodDate.getFullYear()}`;
        },
        sortByOrder: (arr) => {
            return [...arr].sort((a, b) => {
                const orderA = a.order !== undefined ? a.order : (a.timestamp?.toMillis ? a.timestamp.toMillis() : 0);
                const orderB = b.order !== undefined ? b.order : (b.timestamp?.toMillis ? b.timestamp.toMillis() : 0);
                return orderA - orderB;
            });
        },
        initSortable: (container, dataRef, collectionName) => {
            return new Sortable(container, {
                animation: 150, delay: 200, delayOnTouchOnly: true, touchStartThreshold: 5, ghostClass: 'sortable-ghost',
                onEnd: (evt) => {
                    const newOrder = [...dataRef.current];
                    if (evt.oldIndex !== undefined && evt.newIndex !== undefined) {
                      const moved = newOrder.splice(evt.oldIndex, 1)[0];
                      newOrder.splice(evt.newIndex, 0, moved);
                      const updates = newOrder.map((item, idx) => ({ id: item.id, data: { order: idx } }));
                      FirebaseService.batchUpdate(collectionName, updates);
                    }
                }
            });
        }
    };

    // ==========================================
    // 5. REUSABLE COMPONENTS
    // ==========================================
    const PrimaryButton = ({ children, onClick, className="" }) => <button onClick={onClick} className={`flex-[2] p-4 font-[900] text-white uppercase text-[0.8rem] bg-accent rounded-xl shadow-lg hover:bg-blue-700 transition-colors ${className}`}>{children}</button>;
    const SecondaryButton = ({ children, onClick, className="" }) => <button onClick={onClick} className={`flex-1 p-4 font-[900] text-text-sec uppercase text-[0.8rem] bg-gray-100 dark:bg-gray-800 rounded-xl hover:opacity-80 transition-colors ${className}`}>{children}</button>;
    const DangerButton = ({ children, onClick, className="" }) => <button onClick={onClick} className={`flex-[2] p-4 font-[900] text-white uppercase text-[0.8rem] bg-danger rounded-xl shadow-lg transition-colors ${className}`}>{children}</button>;

    const ButtonIcon = ({ icon, onClick, className = "", style }) => <button onClick={onClick} className={`bg-transparent border-none text-xl p-2 cursor-pointer ${className}`} style={style}><i className={icon}></i></button>;
    const ButtonDanger = ({ icon, onClick, className = "" }) => <button onClick={onClick} className={`bg-transparent border-none text-danger text-[1.2rem] cursor-pointer p-1 ${className}`}><i className={icon}></i></button>;
    
    const Input = (props) => <input {...props} className={`w-full p-3 mt-1 border border-border-color dark:border-dark-border rounded-xl bg-bg-color dark:bg-dark-bg text-text-main dark:text-white outline-none focus:border-accent font-medium ${props.className || ''}`} />;
    const Select = (props) => <select {...props} className={`w-full p-3 mt-1 border border-border-color dark:border-dark-border rounded-xl bg-bg-color dark:bg-dark-bg text-text-main dark:text-white outline-none focus:border-accent font-medium ${props.className || ''}`}>{props.children}</select>;

    const Card = ({ children, className = "", onClick, style, id }) => <div id={id} onClick={onClick} style={style} className={`bg-surface-color dark:bg-dark-surface m-4 p-4 rounded-[15px] shadow-sm relative transition-all ${onClick ? 'cursor-pointer active:scale-[0.98]' : ''} ${className}`}>{children}</div>;
    const CardRow = ({ children, className = "", onClick }) => <div onClick={onClick} className={`flex justify-between items-center py-2.5 border-b border-border-color dark:border-dark-border last:border-b-0 ${onClick ? 'cursor-pointer' : ''} ${className}`}>{children}</div>;

    const FAB = ({ onClick }) => <button onClick={onClick} className="fixed bottom-[30px] right-[30px] w-[64px] h-[64px] rounded-full bg-surface-color/90 dark:bg-dark-surface/90 backdrop-blur-md text-accent border border-border-color dark:border-dark-border text-[1.8rem] shadow-lg cursor-pointer z-[99] flex justify-center items-center hover:scale-105 transition-transform"><i className="fas fa-plus"></i></button>;

    const FrozenHeader = ({ title, subtitle, bgColor, actions, nav }) => (
        <div className="sticky top-2.5 m-2.5 p-[15px_20px] rounded-[25px] flex flex-col gap-2 z-[100] shadow-lg text-white backdrop-blur-md" style={{ backgroundColor: bgColor }}>
            <div className="flex justify-between items-center border-b border-white/30 pb-1.5">
                <div>
                    <h2 className="m-0 text-[1.6rem] font-[900] leading-tight text-white">{title}</h2>
                    {subtitle && <p className="m-0 text-[0.9rem] opacity-90 font-medium text-white">{subtitle}</p>}
                </div>
                <div className="flex gap-1 text-white items-center">{actions}</div>
            </div>
            {nav && <div className="flex gap-[20px] justify-center pt-1">{nav}</div>}
        </div>
    );

    const BaseModal = ({ isOpen, title, children }) => {
        if (!isOpen) return null;
        return (
            <div className="fixed inset-0 bg-black/60 z-[1000] flex justify-center items-center backdrop-blur-sm">
                <div className="bg-surface-color dark:bg-dark-surface p-6 rounded-[24px] w-[90%] max-w-[420px] shadow-2xl animate-scale-in">
                    <h3 className="mt-0 mb-4 text-xl font-black">{title}</h3>
                    {children}
                </div>
            </div>
        );
    };

    // ==========================================
    // 6. CONTEXT & STATE MANAGEMENT
    // ==========================================
    const AppContext = createContext();
    const useApp = () => useContext(AppContext);

    const AppProvider = ({ children }) => {
        const [isReady, setIsReady] = useState(false);
        const [view, setView] = useState({ page: PAGES.MAIN, data: null });
        const [theme, setTheme] = useState(localStorage.getItem('theme') || 'system');
        const [modal, setModal] = useState({ type: null, data: null }); 

        const [dbSectoare, setDbSectoare] = useState({});
        const [dbMagazine, setDbMagazine] = useState({});
        const [dbProduse, setDbProduse] = useState({});
        const [dbLoturi, setDbLoturi] = useState({});

        const [catalogCategorii, setCatalogCategorii] = useState(JSON.parse(localStorage.getItem('catalogCategorii')) || CONFIG.DEFAULT_CATALOG);
        const [reteleMagazine, setReteleMagazine] = useState(JSON.parse(localStorage.getItem('reteleMagazine')) || CONFIG.DEFAULT_RETELE);
        const [proprietatiMagazine, setProprietatiMagazine] = useState(JSON.parse(localStorage.getItem('proprietatiMagazine')) || CONFIG.DEFAULT_PROPS);
        
        const getExpConf = (lvl, defVal, defUnit) => ({ val: Math.max(0, parseInt(localStorage.getItem(`expTimeVal_${lvl}`)) || defVal), unit: localStorage.getItem(`expTimeUnit_${lvl}`) || defUnit });
        const [expConfigs, setExpConfigs] = useState({ global: getExpConf('global', 2, 'luni'), sector: getExpConf('sector', 1, 'luni'), store: getExpConf('store', 2, 'saptamani') });

        // Storage Updates
        const updateCatalog = (newCat) => { setCatalogCategorii(newCat); localStorage.setItem('catalogCategorii', JSON.stringify(newCat)); };
        const updateRetele = (newRet) => { setReteleMagazine(newRet); localStorage.setItem('reteleMagazine', JSON.stringify(newRet)); };
        const updateProp = (newProp) => { setProprietatiMagazine(newProp); localStorage.setItem('proprietatiMagazine', JSON.stringify(newProp)); };
        const updateExpConfig = (type, val, unit) => { localStorage.setItem(`expTimeVal_${type}`, val); localStorage.setItem(`expTimeUnit_${type}`, unit); setExpConfigs(prev => ({ ...prev, [type]: { val, unit } })); };

        // Modal Helpers
        const openModal = (type, data = null) => setModal({ type, data });
        const closeModal = () => setModal({ type: null, data: null });
        const confirmAction = (title, msg, onConfirm) => openModal(MODAL_TYPES.CONFIRM, { title, msg, onConfirm });
        const promptAction = (title, val, placeholder, onSave) => openModal(MODAL_TYPES.PROMPT, { title, val, placeholder, onSave });

        // Theme sync
        useEffect(() => {
            if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark'); document.body.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark'); document.body.setAttribute('data-theme', 'light');
            }
            localStorage.setItem('theme', theme);
        }, [theme]);

        // Firebase Sync
        useEffect(() => {
            let loads = 0; const checkReady = () => { loads++; if(loads === 4) setTimeout(() => setIsReady(true), 300); };
            const u1 = db.collection('sectoare').onSnapshot(s => { let obj={}; s.forEach(d => obj[d.id] = {id: d.id, ...d.data()}); setDbSectoare(obj); checkReady(); }, err => console.error(err));
            const u2 = db.collection('magazine').onSnapshot(s => { let obj={}; s.forEach(d => obj[d.id] = {id: d.id, ...d.data()}); setDbMagazine(obj); checkReady(); }, err => console.error(err));
            const u3 = db.collection('produse_magazin').onSnapshot(s => { let obj={}; s.forEach(d => obj[d.id] = {id: d.id, ...d.data()}); setDbProduse(obj); checkReady(); }, err => console.error(err));
            const u4 = db.collection('loturi').onSnapshot(s => { let obj={}; s.forEach(d => obj[d.id] = {id: d.id, ...d.data()}); setDbLoturi(obj); checkReady(); }, err => console.error(err));
            return () => { u1(); u2(); u3(); u4(); };
        }, []);

        // History API (Swipe Back logic)
        const uiDepthRef = useRef(0);
        const popLockRef = useRef(false);

        const closeTopLayer = () => {
            if (modal.type) { closeModal(); return true; }
            if (view.page === PAGES.PRODUCT) { setView({page: PAGES.STORE, data: view.data.backData}); return true; }
            if (view.page === PAGES.STORE) { setView({page: PAGES.SECTOR, data: view.data.sector}); return true; }
            if (view.page === PAGES.SECTOR || view.page === PAGES.SETTINGS) { setView({page: PAGES.MAIN, data: null}); return true; }
            return false;
        };

        const getUiDepth = () => {
            let d = 0;
            if (view.page === PAGES.SECTOR || view.page === PAGES.SETTINGS) d = 1;
            if (view.page === PAGES.STORE) d = 2;
            if (view.page === PAGES.PRODUCT) d = 3;
            if (modal.type) d++;
            return d;
        };

        useEffect(() => { history.replaceState({ appDepth: 0 }, document.title); }, []);

        useEffect(() => {
            const depth = getUiDepth();
            if (popLockRef.current) { uiDepthRef.current = depth; popLockRef.current = false; return; }
            if (depth > uiDepthRef.current) { history.pushState({ appDepth: depth }, document.title); }
            uiDepthRef.current = depth;
        }, [view, modal]);

        useEffect(() => {
            const onPopState = () => { popLockRef.current = true; closeTopLayer(); };
            window.addEventListener('popstate', onPopState);
            return () => window.removeEventListener('popstate', onPopState);
        }, [view, modal]);

        const contextValue = {
            isReady, view, setView, theme, setTheme, modal, openModal, closeModal, confirmAction, promptAction,
            dbSectoare, dbMagazine, dbProduse, dbLoturi,
            catalogCategorii, updateCatalog, reteleMagazine, updateRetele, proprietatiMagazine, updateProp, expConfigs, updateExpConfig
        };

        return <AppContext.Provider value={contextValue}>{children}</AppContext.Provider>;
    };

    // --- Componentă Expirări Reutilizabilă ---
    const ExpirariBox = ({ type, data }) => {
        const { dbSectoare, dbMagazine, dbProduse, dbLoturi, expConfigs, updateExpConfig, setView, catalogCategorii } = useApp();
        const config = expConfigs[type];
        const [val, setVal] = useState(config.val === 0 ? '' : config.val);
        const [unit, setUnit] = useState(config.unit);

        const handleConfigChange = (newValStr, newUnit) => { 
            setVal(newValStr); setUnit(newUnit); 
            let parsedVal = Math.max(0, parseInt(newValStr) || 0);
            updateExpConfig(type, parsedVal, newUnit); 
        };

        const zileMaxime = useMemo(() => {
            let v = parseInt(val) || 0;
            if(unit === 'saptamani') return v * 7; if(unit === 'luni') return v * 30; return v;
        }, [val, unit]);

        const items = useMemo(() => {
            let arr = []; let msAzi = new Date().setHours(0,0,0,0);
            for(let lotId in dbLoturi) {
                let lot = dbLoturi[lotId]; 
                let prod = dbProduse[lot.produsId]; if(!prod) continue;
                let mag = dbMagazine[prod.magazinId]; if(!mag) continue;
                let sec = dbSectoare[mag.sectorId]; if(!sec) continue;

                let isDrojdii = prod.categorie === 'Drojdii';
                let lotDataExp = lot.dataExp;
                if (!isDrojdii && lot.dataProd && lot.dataProd !== "N/A") {
                    let catObj = catalogCategorii[prod.categorie];
                    let expCalc = Helpers.calculeazaExpirare(lot.dataProd, catObj);
                    if (expCalc !== "Dată invalidă") {
                        lotDataExp = expCalc;
                    }
                }

                let expTime = Helpers.convertDataToTime(lotDataExp);
                if(expTime > 8000000000000000) continue; 
                let zileRamase = Math.round((expTime - msAzi) / (1000 * 3600 * 24));

                if (zileRamase <= zileMaxime) {
                    if (type === 'global' || (type === 'sector' && data?.currentSectorId === sec.id) || (type === 'store' && data?.currentStoreId === mag.id)) {
                        arr.push({ lot: { ...lot, dataExp: lotDataExp }, prod, mag, sec, zile: zileRamase });
                    }
                }
            }
            return arr.sort((a, b) => a.zile - b.zile);
        }, [dbSectoare, dbMagazine, dbProduse, dbLoturi, zileMaxime, type, data, catalogCategorii]);

        return (
            <Card className="!border-[1.5px] !border-danger !shadow-lg">
                <div className="flex justify-between items-center font-bold text-[1.1rem] text-danger flex-wrap gap-2 border-b border-danger/20 pb-3">
                    <span className="flex items-center gap-2"><i className="fas fa-exclamation-circle text-xl"></i> Expiră în curând</span>
                    <div className="flex gap-2 items-center bg-transparent border border-border-color dark:border-dark-border p-1.5 rounded-xl">
                        <input type="number" min="0" placeholder="0" value={val} onChange={e => setVal(e.target.value)} onBlur={() => handleConfigChange(val, unit)} className="w-[45px] bg-transparent text-center font-bold outline-none text-text-main dark:text-dark-text-main" />
                        <select value={unit} onChange={e => handleConfigChange(val, e.target.value)} className="bg-transparent dark:bg-dark-surface font-bold outline-none cursor-pointer text-text-main dark:text-white">
                            <option value="zile" className="dark:bg-dark-surface dark:text-white">Zile</option>
                            <option value="saptamani" className="dark:bg-dark-surface dark:text-white">Săpt.</option>
                            <option value="luni" className="dark:bg-dark-surface dark:text-white">Luni</option>
                        </select>
                    </div>
                </div>
                <div className="pt-2">
                    {items.length === 0 ? (
                        <div className="p-4 text-center text-text-sec font-medium">Toate produsele sunt în termen.</div>
                    ) : items.map((item, idx) => (
                        <div key={idx} className="border-b border-border-color dark:border-dark-border py-4 flex justify-between items-start last:border-0">
                            <div className="flex-1 pr-2">
                                <div className="mb-2 cursor-pointer font-black text-[1.05rem]" onClick={() => setView({page: PAGES.PRODUCT, data: { id: item.prod.id, nume: item.prod.nume, categorie: item.prod.categorie, magazinCuloare: item.mag.culoare, magazinNume: item.mag.nume, magazinAdresa: item.mag.adresa, backData: {magazin: item.mag, sector: item.sec} }})}>
                                    {item.prod.nume} <span className="text-text-sec font-medium text-[0.9rem]">({item.lot.cantitate} buc)</span>
                                </div>
                                <div className="text-[0.9rem] mb-3 font-medium text-danger">
                                    {item.zile < 0 ? <span>A expirat de {Math.abs(item.zile)} zile</span> : 
                                     item.zile === 0 ? <span>Expiră ASTĂZI</span> : 
                                     <span>Va expira în {item.zile} zile</span>}
                                </div>
                                {(type === 'global' || type === 'sector') && (
                                    <div className="flex flex-wrap gap-2 mt-2">
                                        {type === 'global' && (
                                            <span onClick={() => setView({page: PAGES.SECTOR, data: item.sec})} className="inline-flex items-center gap-1.5 px-3 py-1 bg-surface-color dark:bg-dark-surface text-text-main dark:text-dark-text-main rounded-xl text-[0.75rem] font-bold cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-800 shadow-sm border border-border-color/50 dark:border-dark-border/50">

                    <div className="text-[0.95rem] font-bold text-text-sec mb-[5px]">Alege din catalog:</div>
                    <Select value={newProdState.nume} onChange={e=>setNewProdState({...newProdState, nume: e.target.value})}>
                        <option value="">-- Selectează un produs --</option>
                        {(catalogCategorii[newProdState.cat] ? catalogCategorii[newProdState.cat].produse : []).map((p,i) => <option key={i} value={p}>{p}</option>)}
                    </Select>
                    <div className="flex gap-3 pt-5">
                        <SecondaryButton onClick={closeModal}>Anulează</SecondaryButton>
                        <PrimaryButton onClick={()=>{
                            if(newProdState.nume){
                                FirebaseService.add('produse_magazin', {magazinId: magazin.id, categorie: newProdState.cat, nume: newProdState.nume});
                                closeModal();
                            } else { alert("Alege un produs!"); }
                        }}>Salvează</PrimaryButton>
                    </div>
                </BaseModal>

                <BaseModal isOpen={modal.type === MODAL_TYPES.EDIT_STORE} title="Editează Magazin">
                    <Input placeholder="Nume" value={editStore.nume} onChange={e=>setEditStore({...editStore, nume:e.target.value})} />
                    <Input placeholder="Adresă" value={editStore.adresa} onChange={e=>setEditStore({...editStore, adresa:e.target.value})} />
                    <div className="mt-2 text-[0.85rem] font-bold text-text-sec ml-1">Rețea:</div>
                    <Select value={editStore.retea} onChange={e=>setEditStore({...editStore, retea:e.target.value})} className="!mt-0">
                        {reteleMagazine.map((r,i) => <option key={i} value={r.nume}>{r.nume}</option>)}
                    </Select>
                    <div className="mt-2 text-[0.85rem] font-bold text-text-sec ml-1">Sector (Mutare):</div>
                    <Select value={editStore.sectorId} onChange={e=>setEditStore({...editStore, sectorId:e.target.value})} className="!mt-0">
                        {allSectoare.map(s => <option key={s.id} value={s.id}>{s.nume}</option>)}
                    </Select>
                    <div className="flex gap-3 pt-5">
                        <SecondaryButton onClick={closeModal}>Anulează</SecondaryButton>
                        <PrimaryButton onClick={()=>{
                            if(editStore.nume){
                                let objRet = reteleMagazine.find(r=>r.nume===editStore.retea);
                                let cul = objRet ? objRet.culoare : CONFIG.COLORS.DEFAULT_STORE;
                                FirebaseService.update('magazine', magazin.id, { nume: editStore.nume, adresa: editStore.adresa, retea: editStore.retea, sectorId: editStore.sectorId, culoare: cul });
                                
                                if(editStore.sectorId !== magazin.sectorId) setView({page: PAGES.SECTOR, data: sector}); 
                                else setView({page: PAGES.STORE, data: { magazin: {...magazin, nume: editStore.nume, adresa: editStore.adresa, retea: editStore.retea, culoare: cul}, sector }});
                                closeModal();
                            }
                        }}>Salvează</PrimaryButton>
                    </div>
                </BaseModal>
            </div>
        );
    };

    // --- Sub-componentă curată pentru Rândurile de Loturi ---
    const LotRow = ({ l, isDrojdii, catObj, confirmAction, onUpdate }) => {
        const [cantitate, setCantitate] = useState(l.cantitate === 0 ? '' : l.cantitate);
        const [dataExp, setDataExp] = useState(l.dataExp || '');
        const [dataProd, setDataProd] = useState(l.dataProd || '');

        useEffect(() => { setCantitate(l.cantitate === 0 ? '' : l.cantitate); }, [l.cantitate]);
        useEffect(() => { setDataExp(l.dataExp || ''); }, [l.dataExp]);
        useEffect(() => { setDataProd(l.dataProd || ''); }, [l.dataProd]);

        const handleQtyBlur = () => {
            let val = parseInt(cantitate);
            if (isNaN(val) || val < 0) val = 0;
            setCantitate(val === 0 ? '' : val);
            if (val !== l.cantitate) {
                FirebaseService.update('loturi', l.id, { cantitate: val });
                onUpdate();
            }
        };

        const handleExpBlur = () => {
            if (!/^\d{2}\.\d{2}\.\d{4}$/.test(dataExp)) {
                alert("Format invalid! Introduceți ZZ.LL.AAAA (ex: 15.08.2025)");
                setDataExp(l.dataExp);
                return;
            }
            if (dataExp !== l.dataExp) {
                FirebaseService.update('loturi', l.id, { dataExp });
                onUpdate();
            }
        };

        const handleProdBlur = () => {
            if (!/^\d{2}\.\d{2}\.\d{4}$/.test(dataProd)) {
                alert("Format invalid! Introduceți ZZ.LL.AAAA (ex: 15.08.2025)");
                setDataProd(l.dataProd);
                return;
            }
            if (dataProd !== l.dataProd) {
                let expCalc = Helpers.calculeazaExpirare(dataProd, catObj);
                if (expCalc !== "Dată invalidă") {
                    FirebaseService.update('loturi', l.id, { dataProd, dataExp: expCalc });
                    onUpdate();
                } else {
                    alert("Dată invalidă calculată!");
                    setDataProd(l.dataProd);
                }
            }
        };

        return (
            <div className="flex justify-between items-center bg-bg-color dark:bg-dark-bg p-2.5 rounded-xl mt-3 border border-border-color dark:border-dark-border shadow-sm">
                <div className="flex flex-col items-center">
                    <span className="text-[0.7rem] font-bold text-text-sec uppercase">Buc</span>
                    <input type="number" min="0" placeholder="0" value={cantitate} onChange={e => setCantitate(e.target.value)} onBlur={handleQtyBlur} className="w-[50px] text-center p-1 mt-1 font-black text-[1.05rem] border border-border-color dark:border-dark-border rounded-lg bg-surface-color dark:bg-dark-surface text-text-main dark:text-white outline-none focus:border-accent" />
                </div>
                <div className="flex flex-col items-center px-1">
                    <span className="text-[0.7rem] font-bold text-text-sec uppercase">Expiră pe</span>
                    {isDrojdii ? (
                        <input type="text" value={dataExp} onChange={e => setDataExp(e.target.value)} onBlur={handleExpBlur} className="text-danger font-black w-[95px] text-center p-1 mt-1 text-[0.95rem] tracking-tighter border border-border-color dark:border-dark-border rounded-lg bg-surface-color dark:bg-dark-surface outline-none focus:border-accent" />
                    ) : (
                        <strong className="text-danger font-black text-[1rem] mt-2 tracking-tighter">{dataExp}</strong>
                    )}
                </div>
                <div className="flex flex-col items-center px-1">
                    <span className="text-[0.7rem] font-bold text-text-sec uppercase">Data Prod.</span>
                    {isDrojdii ? (
                        <span className="text-[0.85rem] font-bold text-border-color mt-2">N/A</span>
                    ) : (
                        <input type="text" value={dataProd} onChange={e => setDataProd(e.target.value)} onBlur={handleProdBlur} className="w-[95px] text-center p-1 mt-1 font-bold text-[0.95rem] tracking-tighter border border-border-color dark:border-dark-border rounded-lg bg-surface-color dark:bg-dark-surface text-text-main dark:text-white outline-none focus:border-accent" />
                    )}
                </div>
                <ButtonDanger icon="fas fa-times-circle" className="!text-[1.3rem] !p-1" onClick={() => confirmAction("Șterge Lot", "Sigur?", () => { FirebaseService.delete('loturi', l.id); onUpdate(); })} />
            </div>
        );
    };

    const ProductPage = () => {
        const { view, setView, catalogCategorii, dbMagazine, dbProduse, dbLoturi, confirmAction, modal, openModal, closeModal } = useApp();
        
        const rawProd = view.data;
        const prod = { ...rawProd, ...(dbProduse[rawProd.id] || {}) }; 
        const activeMag = dbMagazine[prod.magazinId] || { nume: prod.magazinNume, adresa: prod.magazinAdresa, culoare: prod.magazinCuloare };

        const isDrojdii = prod.categorie === 'Drojdii';
        const catObj = catalogCategorii[prod.categorie];
        
        const loturiCurente = useMemo(() => {
            return Object.values(dbLoturi).filter(l => l.produsId === prod.id).map(lot => {
                let l = {...lot};
                if(!isDrojdii && l.dataProd && l.dataProd !== "N/A") {
                    let expCalc = Helpers.calculeazaExpirare(l.dataProd, catObj);
                    if(expCalc !== "Dată invalidă") {
                        l.dataExp = expCalc;
                    }
                }
                return l;
            }).sort((a,b) => Helpers.convertDataToTime(a.dataExp) - Helpers.convertDataToTime(b.dataExp));
        }, [dbLoturi, prod.id, isDrojdii, catObj]);

        const totalVitrina = loturiCurente.reduce((sum, l) => sum + (parseInt(l.cantitate)||0), 0);
        
        const [stocMan, setStocMan] = useState(prod.stocManual === 0 ? '' : (prod.stocManual || ''));
        useEffect(() => { setStocMan(prod.stocManual === 0 ? '' : (prod.stocManual || '')); }, [prod.stocManual]);

        const [depozit, setDepozit] = useState(prod.depozit || '');
        useEffect(() => { setDepozit(prod.depozit || ''); }, [prod.depozit]);

        const [notite, setNotite] = useState(prod.notite || '');
        useEffect(() => { setNotite(prod.notite || ''); }, [prod.notite]);

        const [newLot, setNewLot] = useState({ qty: '', data: '' });

        const [actualizatData, setActualizatData] = useState(() => {
            const acum = new Date();
            return acum.toLocaleDateString('ro-RO') + ' ' + acum.toLocaleTimeString('ro-RO', {hour:'2-digit', minute:'2-digit'});
        });
        
        const triggerUpdate = () => {
            const acum = new Date();
            setActualizatData(acum.toLocaleDateString('ro-RO') + ' ' + acum.toLocaleTimeString('ro-RO', {hour:'2-digit', minute:'2-digit'}));
        };
        
        return (
            <div className="animate-fade-in pb-[100px]">
                <FrozenHeader title={prod.nume} subtitle={`${activeMag.nume} - ${activeMag.adresa}`} bgColor={activeMag.culoare || CONFIG.COLORS.DEFAULT_STORE} actions={
                    <React.Fragment>
                        <ButtonIcon icon="fas fa-arrow-left text-white" onClick={()=>setView({page: PAGES.STORE, data: prod.backData || { magazin: activeMag, sector: { id: activeMag.sectorId, nume: 'Sector' } }})}/>
                        <ButtonIcon icon="fas fa-home text-white" onClick={()=>setView({page: PAGES.MAIN})}/>
                    </React.Fragment>
                } />
                
                <Card>
                    <textarea 
                        className="w-full p-4 border border-border-color dark:border-dark-border rounded-xl bg-bg-color dark:bg-dark-bg font-medium outline-none focus:border-accent text-text-main dark:text-white" 
                        placeholder="Notițe de făcut..." rows="2"
                        value={notite}
                        onChange={(e) => setNotite(e.target.value)}
                        onBlur={() => { FirebaseService.update('produse_magazin', prod.id, { notite }); triggerUpdate(); }}
                    ></textarea>
                </Card>

                <Card>
                    <div className="font-black text-[1.2rem] mb-2">Cantitatea</div>
                    <CardRow className="!py-1">
                        <span className="font-bold">Depozit:</span> 
                        <Input 
                            type="text" 
                            className="!w-[50%] !m-0 !p-2 !text-center font-bold text-text-main dark:text-white" 
                            value={depozit}
                            onChange={e=>setDepozit(e.target.value)}
                            onBlur={()=>{ FirebaseService.update('produse_magazin', prod.id, { depozit }); triggerUpdate(); }}
                        />
                    </CardRow>
                    <div className="grid grid-cols-2 gap-3 mt-4">
                        <div className="bg-bg-color dark:bg-dark-bg p-3 rounded-xl text-center border border-border-color dark:border-dark-border shadow-sm">
                            <span className="block text-[0.8rem] font-bold text-text-sec uppercase tracking-wide mb-1">Vitrină (Sumă)</span>
                            <div className="text-[1.8rem] font-black text-accent">{totalVitrina}</div>
                        </div>
                        <div className="bg-bg-color dark:bg-dark-bg p-3 rounded-xl text-center border border-border-color dark:border-dark-border shadow-sm">
                            <span className="block text-[0.8rem] font-bold text-text-sec uppercase tracking-wide mb-1">Stoc (Manual)</span>
                            <div className="flex items-center justify-center gap-1 mt-1">
                                <input 
                                    type="number" min="0" placeholder="0" 
                                    className="w-[60%] text-center border-none bg-transparent font-black text-[1.4rem] text-text-main dark:text-white outline-none" 
                                    value={stocMan} 
                                    onChange={e=>setStocMan(e.target.value)} 
                                    onBlur={()=>{ 
                                        let val = parseInt(stocMan); if(isNaN(val)||val<0) val=0; 
                                        setStocMan(val===0?'':val); 
                                        FirebaseService.update('produse_magazin', prod.id, { stocManual: val }); 
                                        triggerUpdate();
                                    }} 
                                />
                                <button onClick={()=>{if(stocMan)alert(`Salvat! Stoc: ${stocMan}`);}} className="text-white bg-[#0088cc] rounded-lg p-[8px_12px] shadow-md"><i className="fas fa-paper-plane"></i></button>
                            </div>
                        </div>
                    </div>
                </Card>

                <Card>
                    <div className="flex justify-between items-center font-black text-[1.2rem] mb-2">
                        Loturi Valabilitate
                        <div className="flex items-center gap-2">
                            <span className="text-[0.7rem] font-bold text-text-sec bg-gray-100 dark:bg-gray-800 p-1.5 rounded-lg tracking-tight">Act - {actualizatData}</span>
                            <ButtonIcon icon="fas fa-plus" className="!text-accent !bg-blue-100 dark:!bg-blue-900/50 !rounded-full !p-[6px_8px] !text-[1rem]" onClick={() => { setNewLot({qty: '', data: ''}); openModal(MODAL_TYPES.ADD_LOT); }} />
                        </div>
                    </div>
                    <div>
                        {loturiCurente.map(l => (
                            <LotRow key={l.id} l={l} isDrojdii={isDrojdii} catObj={catObj} confirmAction={confirmAction} onUpdate={triggerUpdate} />
                        ))}
                    </div>
                </Card>

                <BaseModal isOpen={modal.type === MODAL_TYPES.ADD_LOT} title="Adaugă Lot Nou">
                    <Input type="number" min="0" placeholder="Cantitate (opțional)" value={newLot.qty} onChange={e=>setNewLot({...newLot, qty:e.target.value})} />
                    <div className="flex gap-[10px] items-center mt-2 w-full">
                        <Input placeholder="Data (ZZ.LL.AAAA)" value={newLot.data} onChange={e=>setNewLot({...newLot, data:e.target.value})} className="flex-1" />
                        <label className="relative flex items-center justify-center p-3 border border-border-color dark:border-dark-border rounded-xl bg-bg-color dark:bg-dark-bg text-accent h-[50px] mt-1 cursor-pointer w-[50px] flex-shrink-0">
                            <i className="fas fa-calendar-alt text-xl"></i>
                            <input type="date" className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onChange={e=>{
                                if(!e.target.value) return; 
                                let d=new Date(e.target.value); 
                                setNewLot({...newLot, data: `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`});
                            }} />
                        </label>
                    </div>
                    <div className={`text-[0.85rem] mt-2 text-center font-bold ${isDrojdii ? 'text-danger' : 'text-text-sec'}`}>
                        {isDrojdii ? 'Se cere Data Expirării (ZZ.LL.AAAA)' : 'Se cere Data Prod. (ZZ.LL.AAAA)'}
                    </div>
                    <div className="flex gap-3 pt-5">
                        <SecondaryButton onClick={closeModal}>Anulează</SecondaryButton>
                        <PrimaryButton onClick={()=>{
                            if(newLot.data) {
                                if (!/^\d{2}\.\d{2}\.\d{4}$/.test(newLot.data)) {
                                    alert("Format invalid! Introduceți ZZ.LL.AAAA (ex: 15.08.2025)");
                                    return;
                                }
                                let valQ = parseInt(newLot.qty); if(isNaN(valQ) || valQ < 0) valQ = 0;
                                let expStr = isDrojdii ? newLot.data : Helpers.calculeazaExpirare(newLot.data, catObj);
                                let prodStr = isDrojdii ? "N/A" : newLot.data;
                                FirebaseService.add('loturi', {produsId: prod.id, cantitate: valQ, dataProd: prodStr, dataExp: expStr});
                                triggerUpdate();
                                closeModal();
                            } else { alert('Introduceți măcar data!'); }
                        }}>Salvează</PrimaryButton>
                    </div>
                </BaseModal>
            </div>
        );
    };

    // ==========================================
    // 8. MAIN APP
    // ==========================================
    const MainApp = () => {
        const { isReady, view, modal, closeModal, reteleMagazine, updateRetele } = useApp();
        const [editRetState, setEditRetState] = useState({ nume: '', culoare: '' });
        
        useEffect(() => {
            if (modal.type === MODAL_TYPES.EDIT_RET && modal.data) {
                setEditRetState({ nume: modal.data.nume, culoare: modal.data.culoare });
            }
        }, [modal]);

        return (
            <React.Fragment>
                {!isReady && (
                    <div className="fixed inset-0 bg-bg-color dark:bg-dark-bg z-[9999] flex flex-col items-center justify-center transition-opacity duration-300">
                        <img src="https://cdn-icons-png.flaticon.com/512/1356/1356559.png" alt="Liada Logo" className="w-[120px] h-[120px] animate-pulse-fast mb-5 drop-shadow-lg" />
                        <h1 className="font-[900] text-[#ff3b30] text-[2.2rem] m-0 tracking-[2px]">LIADA</h1>
                    </div>
                )}
                
                {view.page === PAGES.MAIN && <MainPage />}
                {view.page === PAGES.SETTINGS && <SettingsPage />}
                {view.page === PAGES.SECTOR && <SectorPage />}
                {view.page === PAGES.STORE && <StorePage />}
                {view.page === PAGES.PRODUCT && <ProductPage />}

                {/* GLOBAL MODALS */}
                <BaseModal isOpen={modal.type === MODAL_TYPES.EDIT_RET} title="Editează Rețea">
                    <Input placeholder="Nume" value={editRetState.nume} onChange={e=>setEditRetState({...editRetState, nume:e.target.value})} />
                    <Input type="color" value={editRetState.culoare} onChange={e=>setEditRetState({...editRetState, culoare:e.target.value})} className="!h-[50px] !p-[3px] cursor-pointer" />
                    <div className="flex gap-3 pt-5">
                        <SecondaryButton onClick={closeModal}>Anulează</SecondaryButton>
                        <PrimaryButton onClick={()=>{
                            if(editRetState.nume){
                                let nr = [...reteleMagazine];
                                nr[modal.data.index] = { nume: editRetState.nume, culoare: editRetState.culoare };
                                updateRetele(nr);
                                
                                db.collection('magazine').where('retea', '==', modal.data.oldName).get().then(snap => {
                                    let updates = []; snap.forEach(doc => updates.push({id: doc.id, data: { retea: editRetState.nume, culoare: editRetState.culoare }}));
                                    FirebaseService.batchUpdate('magazine', updates);
                                });
                                closeModal();
                            }
                        }}>Salvează</PrimaryButton>
                    </div>
                </BaseModal>

                <BaseModal isOpen={modal.type === MODAL_TYPES.CONFIRM} title={modal.data?.title}>
                    <p className="text-text-main dark:text-white font-medium text-[1.1rem] mb-5 mt-0">{modal.data?.msg}</p>
                    <div className="flex gap-3">
                        <SecondaryButton onClick={closeModal}>Anulează</SecondaryButton>
                        <DangerButton onClick={()=>{if(modal.data?.onConfirm)modal.data.onConfirm(); closeModal();}}>Șterge</DangerButton>
                    </div>
                </BaseModal>

                <BaseModal isOpen={modal.type === MODAL_TYPES.PROMPT} title={modal.data?.title}>
                    <Input placeholder={modal.data?.placeholder} defaultValue={modal.data?.val} id="prompt-input" autoFocus />
                    <div className="flex gap-3 pt-5">
                        <SecondaryButton onClick={closeModal}>Anulează</SecondaryButton>
                        <PrimaryButton onClick={()=>{
                            let val = document.getElementById('prompt-input').value.trim();
                            if(modal.data?.onSave) modal.data.onSave(val); 
                            closeModal();
                        }}>Salvează</PrimaryButton>
                    </div>
                </BaseModal>
            </React.Fragment>
        );
    };

    // ==========================================
    // 9. REACT DOM RENDER
    // ==========================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppProvider><MainApp /></AppProvider>);
</script>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('Eroare SW:', err));
        });
    }
</script>

</body>
</html>
